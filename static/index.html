// A warning when the router tells devices to use its own IPv6 DNS server, which lets some of their
// lookups skip QuietNet. Shown on the home page and on "Set up a device".
function v6Warning(withLink){
  const others = ((S.status || {}).ipv6 || {}).router_dns_not_ours || [];
  if(!others.length) return '';
  return `<div class="notice warn${withLink ? ' flex' : ''}"><span>Your router tells devices to use its own IPv6 DNS server
    (${others.map(a => '<b>' + esc(a) + '</b>').join(', ')}), so some of their lookups skip QuietNet.
    Set QuietNet's IPv6 address as well, or switch IPv6 off on your router.</span>
    ${withLink ? '<button class="btn link" data-act="tab" data-tab="setup">Show me how</button>' : ''}</div>`;
}
function viewSetup(){
  const ip = esc((S.status || {}).ip || '…');
  const v6 = (S.status || {}).ipv6 || {};
  const ip6 = esc(v6.dns_address || '');
  const step = (title, steps) => `<details><summary>${title}</summary><ol>${steps.map(s => `<li>${s}</li>`).join('')}</ol></details>`;
  // Steps that only apply when QuietNet has an IPv6 address to give, else an empty list.
  const if6 = (...steps) => ip6 ? steps : [];
  const v6Card = ip6 ? `<p>If your router hands out IPv6 (a BT Smart Hub does as it comes), also set this IPv6 address as a DNS server:</p>
    <div class="bigcode">${ip6}</div>
    <p class="meta">Or switch IPv6 off on your router instead (on a BT Smart Hub: <b>Advanced settings</b> → <b>IPv6</b>).
      Otherwise devices also use the router's own IPv6 DNS server, and some of their lookups skip QuietNet.</p>`
    : `<p class="meta"><b>IPv6:</b> QuietNet has no IPv6 address to give devices. If your router hands out IPv6 (a BT Smart Hub
      does as it comes), switch IPv6 off on it (on a BT Smart Hub: <b>Advanced settings</b> → <b>IPv6</b>), or accept that

  const hubCard = `<div class="card"><h2>IPv6 on your router</h2>

    ${v6.hub_off ? '<p class="meta">Nothing more to do here. The steps are kept below in case you want to undo it.</p>'
      : `<p>A BT Smart Hub hands out IPv6 as it comes, and tells every device to use the hub itself for IPv6 DNS. That can't be

    ${step('Best: switch IPv6 off on the hub', ['On a phone or computer at home, open the <b>Hub Manager</b>: type <b>192.168.1.254</b> into a browser (the hub\'s usual number).',
      'Choose <b>Advanced Settings</b> → <b>IPv6</b> → <b>Configuration</b>. It asks for the hub\'s admin password, which is on the hub\'s label or settings card.',
      'Set <b>Allocation Mode</b> to <b>Off</b> and save. Not every Smart Hub offers this. If yours doesn\'t, switch ULA on instead (next section).',
      '<b>Afterwards:</b> turn Wi-Fi off and on again on each device, or restart it. Until then a device keeps the hub\'s old IPv6 DNS server, and looking things up can be slow.',
      'Check anything that may want IPv6: games consoles (party chat) and work laptops (a work VPN). Smart-home gear that uses Thread or Matter makes its own IPv6 and should carry on working.',
      'Come back to this page in about an hour. It says <b>IPv6 is off on your hub</b> once QuietNet has listened for a full hour and heard no IPv6 announcement. It can take longer while this computer still holds its old IPv6 address; restarting the Pi clears that. If it still never says so, the hub is still handing out IPv6.',
      'To undo it, set <b>Allocation Mode</b> back to what it was.'])}
    ${step('If there is no Off: switch ULA on', ['In the same place (<b>Advanced Settings</b> → <b>IPv6</b> → <b>Configuration</b>), turn on <b>ULA Enabled</b> and save.',

      'Set that number as the IPv6 DNS server on each device, using the steps below.',
      'This narrows the gap but does not close it: the hub still gives devices its own IPv6 DNS server, and devices marked "Can bypass over IPv6" still can. The switch below helps a little more.',
      'To undo it, turn <b>ULA Enabled</b> off again.'])}
    ${noIpv6Switch(S.status || {})}
    ${ipv6SteerSwitch(S.status || {})}</div>`;
  return `

      ...if6('Tap <b>Add Server</b> again and type <b>' + ip6 + '</b>.'), 'Tap <b>Save</b>.'])}
    ${step('Android phone or tablet', ['Open <b>Settings</b> → <b>Network &amp; internet</b> → <b>Internet</b> (or <b>Wi-Fi</b>).', 'Tap the cog next to your home Wi-Fi, then the pencil / <b>Advanced</b>.', 'Change <b>IP settings</b> to <b>Static</b> and type <b>' + ip + '</b> in <b>DNS 1</b>. Leave the rest as it is.',
      ...if6('Type <b>' + ip6 + '</b> in <b>DNS 2</b>.'),
      'Save. Also check <b>Settings → Network → Private DNS</b> is <b>Off</b>.',
      'Android may keep using the router\'s own IPv6 DNS server as well, whatever you type here. If your router hands out IPv6, the surest fix is to switch IPv6 off on the router (on a BT Smart Hub: <b>Advanced settings</b> → <b>IPv6</b>).'])}
    ${step('Smart TV, streaming stick or games console', ['Open the TV\'s <b>Network</b> settings and choose your connection.', 'Look for <b>Advanced</b>, <b>Manual</b> or <b>DNS settings</b>.', 'Set <b>DNS</b> (or "Primary DNS") to <b>' + ip + '</b>. Leave everything else on automatic.',
      ...if6('If there is a separate IPv6 DNS setting, set it to <b>' + ip6 + '</b>.')])}
    ${step('Windows PC', ['Open <b>Settings</b> → <b>Network &amp; internet</b> → <b>Wi-Fi</b> → <b>Hardware properties</b>.', 'Next to <b>DNS server assignment</b> choose <b>Edit</b> → <b>Manual</b>.', 'Turn on <b>IPv4</b> and type <b>' + ip + '</b> as the <b>Preferred DNS</b>.',
      ...(ip6 ? ['Turn on <b>IPv6</b> and type <b>' + ip6 + '</b> as the <b>Preferred DNS</b>. Save.']

      ...if6('Press <b>+</b> again and type <b>' + ip6 + '</b>.'), 'Remove any other numbers in the list and press <b>OK</b>.'])}
    ${step('The whole house at once (via your router)', ['Log in to your router (the address and password are usually on a sticker on it).', 'Find the <b>DHCP</b> or <b>LAN</b> settings and look for <b>DNS server</b>.', 'Set it to <b>' + ip + '</b> and save. Devices pick it up next time they reconnect to Wi-Fi.', '<b>Careful:</b> the internet will then seem broken for everyone whenever this computer is off or asleep.'])}
  </div>
  <div class="card"><h2>Good to know</h2>
    <p><b>Keep this computer on.</b> Devices pointed at QuietNet need it running. If it's off or asleep, they won't be able to load anything.</p>
    <p><b>Something stopped working?</b> Press <i>Pause advert blocking for 10 minutes</i>, next to the kill switch. If that fixes it, look at the device's list for something recently blocked and unblock it.</p>
    <p><b>What QuietNet can and can't see.</b> It sees <i>which addresses</i> a device contacts (like <i>ads.example.com</i>), not the pages, messages or passwords — those stay private. It can't remove adverts that come from the same address as the real content (YouTube adverts are the well-known example).</p>
    <p><b>Blocks, schedules and the kill switch take a couple of minutes to bite.</b> They stop a device finding addresses, so something already playing — a video, a game in progress — can carry on for a short while. If an app still works long after, look in the device's list for what it's using and block that too.</p>
    <p><b>Devices are recognised by their hardware address</b>, the label of their network card, where QuietNet can see it. If your router gives a device a new number (like 192.168.1.23), its name, group and blocks follow it within a minute or so. They can't follow a device that connects through a Wi-Fi range extender, or a phone that changes its private Wi-Fi address; QuietNet asks you about those on the Devices page. One device that shows as two (a laptop on both cable and Wi-Fi, say) can be merged on its page, and separated again; QuietNet never merges devices by itself. "Reserving" each device's number in your router still helps.</p>
    <p><b>The number above can change</b> if your router hands this computer a new one. If devices suddenly stop working, come back here and check it. Your router can usually "reserve" the number so it stays put.</p>
    <p class="meta">Everyone in the house should know this is running — it records which services each device talks to. History is kept for 30 days on this computer only.</p>
  </div>
  ${appearanceCard()}`;
}

/* ---------- drawing & refreshing ---------- */
let lastView = '';
function drawList(){ const h = activityList(), el = $('list'); if(el && el.dataset.h !== h){ el.innerHTML = h; el.dataset.h = h; } }
function render(){
  renderChrome();
  const v = S.tab === 'rules' ? viewRules() : S.tab === 'setup' ? viewSetup()
    : S.tab === 'groups' ? (S.group ? viewGroup() : viewGroups()) : S.tab === 'schedules' ? viewSchedules() : S.device ? viewDevice() : viewHome();
  if(v !== lastView){ $('view').innerHTML = v; lastView = v; }
  if($('hours')){ $('hours').value = S.hours; $('sort').value = S.sort; }
}
function softRender(){
  // Refresh without disturbing anything the person is typing into or reading.
  renderChrome();
  if(S.edit) return;                      // never redraw a form someone is filling in
  const a = document.activeElement;
  if(a && (a.id === 'addBox' || a.tagName === 'SELECT')) return;
  if(S.tab === 'home' && S.device && $('list')) drawList();
  else if(S.tab !== 'setup' && !document.querySelector('details[open]')) render();
}
// The 4-second timer passes tick=true. A tick is skipped while the last refresh is still waiting
// for answers, and it fetches a device's activity list (the biggest answer) only every 30 seconds.
// Anything a person does still fetches everything straight away. A refresh still waiting after
// 30 seconds counts as stuck (a request that never finishes), so the timer goes ahead anyway.
let inFlight = 0, inFlightSince = 0, activityAt = 0;
const ACTIVITY_EVERY = 30000, STUCK_AFTER = 30000;
const refreshFree = () => !inFlight || Date.now() - inFlightSince > STUCK_AFTER;
async function refresh(hard, tick){
  inFlight++; inFlightSince = Date.now();
  try{
    const jobs = [api('/api/status').then(x => S.status = x)];
    const ctl = scope => api('/api/controls?scope=' + encodeURIComponent(scope)).then(x => S.ctl[scope] = x);
    if(!S.services.length) jobs.push(api('/api/services').then(x => S.services = x));
    // Schedules are listed on their own tab and, for the scope shown, beside a device's, a group's
    // or the whole house's rules.
    if(S.tab === 'schedules' || S.tab === 'rules' || (S.tab === 'home' && S.device) || (S.tab === 'groups' && S.group))
      jobs.push(api('/api/schedules').then(x => S.schedules = x));
    if(S.tab === 'setup') jobs.push(api('/api/cloud').then(x => S.cloud = x).catch(() => {}));
    let devices = Promise.resolve();
    if(S.tab === 'home' || S.tab === 'groups' || S.tab === 'schedules'){
      // The Pi lists by device: one entry, so one card, for each. ?all=1 asks for the devices
      // with no address of their own now as well (one that has left, and whose address went to
      // another device): its name, rules and history are kept under its number (d.id), and its
      // card says it is not on the network now. An entry with neither an address nor a number
      // could not be opened or changed, so it is left out. (An older Pi ignores ?all=1.)
      devices = api('/api/devices?all=1').then(x => { S.devices = x.filter(d => d.ip || Number.isInteger(d.id)); rekey(); });
      jobs.push(devices, api('/api/groups').then(x => S.groups = x));
    }
    // A device's rules are kept under its number, which the device list gives. So wait for the
    // list first: a card that has only just been given a number (by naming it, say), or a new
    // one (after two devices were joined), is then asked for by the right one.
    if(S.tab === 'home' && S.device) jobs.push(devices.then(() => S.device ? ctl(scopeOf(S.device)) : null));
    if(S.tab === 'groups' && S.group) jobs.push(ctl('group:' + S.group));
    if(S.tab === 'rules') jobs.push(ctl('all'));
    if(S.tab === 'home' && S.device && !(tick && Date.now() - activityAt < ACTIVITY_EVERY)){
      // The server gives a marker with each list. Sending it back gets {"unchanged": true} when
      // nothing has changed since, so the list is not sent again. A marker only counts for the
      // device and time period it came with, so any other pair asks with an empty one.
      // With the device's number (d.id, from a Pi that lists by device) the list is the device's
      // own history at every address it has had; without it, what was recorded under the address.
      // Asked once the device list has arrived, so a card that has only just been given a number
      // is asked for by it.
      jobs.push(devices.then(() => {
        if(!S.device) return null;
        const dev = S.device, hours = S.hours, id = deviceId(dev), ip = addrOf(dev), key = dev + '|' + hours + '|' + id;
        const since = S.activityKey === key ? S.activityMark : '';
        return api(`/api/activity?ip=${encodeURIComponent(ip)}&hours=${hours}&since=${encodeURIComponent(since)}${id ? '&device=' + encodeURIComponent(id) : ''}`).then(x => {
          // Ignore a late answer for a device or time period the person has since moved away from.
          if(S.device !== dev || S.hours !== hours) return;
          if(Array.isArray(x)){ S.activity = x; S.activityKey = ''; }     // an older Pi sends the plain list
          else{
            if(!(x.unchanged && since)) S.activity = x.groups || [];       // unchanged: keep what is shown
            S.activityKey = key; S.activityMark = String(x.marker || '');
          }
          activityAt = Date.now();
        });
      }));
    }
    if(S.tab === 'rules') jobs.push(api('/api/rules').then(x => S.rules = x));
    await Promise.all(jobs);
  }catch(e){
    $('pill').textContent = 'Not running'; $('pill').className = 'pill bad';
    return;
  }finally{
    inFlight--;
  }
  hard ? render() : softRender();
}

// Merge, asked the careful way. Nothing is changed on the first ask: the Pi answers with what
// would apply to each hardware address afterwards (p.hardware) and its own notes, the owner reads
// them, and only the confirm, which sends the preview's marker back, merges. If anything changed
// in between the Pi answers 409 and the new preview is shown. `device` is the number of the device
// merged into, `other` the one merged into it. Answers with {device: the merged device's number},
// null if the owner cancelled, or the error.
function mergeBlocks(p){
  return (p.hardware || []).map(h => ({
    head: 'Hardware address ' + h.mac + ' (now ' + h.label + ')',
    none: 'Only what is set for the whole house.',
    lines: (h.applies || []).map(x => ({text:x.text, tag:x['new'] ? 'New for it' : ''}))
      .concat((h.stops || []).map(t => ({text:t, tag:'Stops applying', cls:'warn'})))}));
}
// The rules that reach a device only because QuietNet is still asking whether it is another one
// ("Same device?", not answered yet), as a second block of the Separate box: they go on applying to
// both hardware addresses whatever is chosen there. Nothing when there are none (p.held is empty,
// or an older Pi sends none).
function separateHeld(p){
  return (p.held || []).length ? [{head:'Applies for now, until you answer "Same device?"', none:'',
                                   lines:p.held.map(t => ({text:t, tag:'Stays for both', cls:'warn'}))}] : [];
}
async function mergeFlow(device, other){
  for(;;){
    let p;
    try{ p = (await api('/api/merge', {device, 'with':other})).preview; }catch(e){ return e; }
    const yes = await askPreview({title:'Merge these two into one device?',
      intro:p.label + ' and ' + p.other_label + ' become one device. Afterwards these rules apply to each hardware address. What is set for the whole house applies as it does now.',
      blocks:mergeBlocks(p), notes:p.notes, buttons:[{label:'Merge them', value:true, cls:'primary'}]});
    if(!yes) return null;
    try{ return {device:(await api('/api/merge', {device, 'with':other, seen:p.marker})).device}; }
    catch(e){ if(e.status !== 409) return e; await oops(e); }
  }
}

// What an older Pi, with no Merge or Separate, is answered with when either is pressed.
const NEEDS_UPDATE = 'This QuietNet needs updating before devices can be ';

const actions = {
  tab(d){ S.tab = d.tab; S.device = null; S.group = null; S.svcOpen = false; S.edit = null; refresh(true); },
  // Open the Appearance chooser at the end of "Set up a device", with the current look focused.
  appearance(){
    S.tab = 'setup'; S.device = null; S.group = null; S.svcOpen = false; S.edit = null;
    refresh(true).then(() => {
      const f = $('appearance');

    });
  },
  async kill(){
    const yes = await ask({title:'Stop all internet now?', ok:'Stop the internet', danger:true,

    if(!yes) return;
    await api('/api/kill', {on:true}).catch(oops); refresh(true);
  },
  async unkill(){ await api('/api/kill', {on:false}).catch(oops); refresh(true); },
  schednew(d){
    const bedtime = d.preset === 'bedtime';

  schededit(d){

    S.edit = JSON.parse(JSON.stringify(x));
    if(x.device != null) S.edit.scope = 'dev:' + x.device;     // the form lists devices by their number

  },
  svctoggle(){ S.svcOpen = !S.svcOpen; render(); },
  async svc(d){ await api('/api/service-block', {scope:d.scope, service:d.s, on:!!d.on}).catch(oops); refresh(true); },
  async scan(){ await api('/api/scan', {}).catch(oops); refresh(true); },
  opengroup(d){ S.group = +d.id; S.svcOpen = false; refresh(true); },
  groupback(){ S.group = null; refresh(true); },
  async newgroup(){
    const name = await ask({title:'New group', text:'For example "Kids", "TVs" or "Guests".', input:'', ok:'Create'});
    if(!name || !name.trim()) return;

  },
  async grouprename(){

  },
  async groupdelete(){
    const yes = await ask({title:'Delete this group?', ok:'Delete', danger:true,
      text:'The devices stay, but anything blocked or switched off for the group is switched back on.'});

  },
  // "Yes, it's the same device" on a notice. Where the Pi gave the two devices' numbers, the answer
  // goes through the same preview as "Merge with": the device the rules belong to (fromdev) is

  // answers 404, and is asked the way it always was.
  async moverules(d){

    if(!yes) return;

  // "It's the same device" on a card whose rules are paused (a Pi that keeps rules under

  async samehere(d){

  async notsame(d){ await api('/api/different-device', d.todev ? {ip:d.ip, device:d.todev} : {ip:d.ip}).catch(oops); refresh(true); },
  // The owner's choice for rules that the move to the devices set aside (st.devices.conflicts).

  // Bring in names, groups and rules that an older QuietNet left where this version no longer reads them.

  // "Merge with" on a device's page: the open device is the one merged into.

    // answers 404, with nothing a person could read.
    if(r instanceof Error && r.status === 404) r.message = NEEDS_UPDATE + 'merged. Nothing was changed.';

  // "Separate" beside one of a device's hardware addresses. The Pi first says what the device

    const id = deviceId(S.device);

      let p;

                 lines:(p.rules || []).map(t => ({text:t}))}].concat(separateHeld(p)),
        notes:(p.notes || []).concat([(p.held || []).length
          ? 'With the same rules, the separated device gets a copy of what ' + p.label + ' carries. With no rules, it gets none of that. Either way, what applies for now goes on applying to both until you answer "Same device?".'
          : 'With the same rules, the separated device gets a copy of everything listed above. With no rules, only what is set for the whole house applies to it.']),
        buttons:[{label:'Separate, with the same rules', value:'copy'}, {label:'Separate, with no rules', value:'none'}]});

  },
  // Put a device into the open group (data-in="1") or take it out (data-in="").

  open(d){ S.device = d.device; S.activity = []; S.activityKey = ''; S.open.clear(); S.search = ''; S.filter = 'all'; S.svcOpen = false; refresh(true); },

  async add(){

  },
  // The open device, or (from a group's "Name it" button) the device the button names.
  async rename(d){

};

// A held-down Enter sends the typed name once, not once for every repeat of the key.
document.addEventListener('keydown', e => { if(e.key === 'Enter' && !e.repeat && e.target.id === 'addBox') actions.add(); });

// Safari before 14.1 ignores 'gap' on flex rows. A one-pixel gap between two empty boxes stacked
// in a column makes the column one pixel tall only where it works; elsewhere add 'nogap' so the
// margin-based spacing in the style sheet takes over.
(function(){
  const box = document.createElement('div');
  box.style.cssText = 'display:flex;flex-direction:column;row-gap:1px;position:absolute;visibility:hidden';
  box.appendChild(document.createElement('div')); box.appendChild(document.createElement('div'));
  document.body.appendChild(box);
  if(box.scrollHeight !== 1) document.documentElement.className += ' nogap';
  document.body.removeChild(box);
})();
refresh(true);
// No timed refresh while a dialog is open, while the tab is in the background, or while the last
// refresh is still running (a slow Pi or relay would otherwise pile requests up).
setInterval(() => { if($('modal').hidden && !document.hidden && refreshFree()) refresh(false, true); }, 4000);
document.addEventListener('visibilitychange', () => { if(!document.hidden && refreshFree()) refresh(false, true); });
</script>
