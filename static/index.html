<body>
<div class="shell">
  <header class="top">
    <div class="logo"><svg class="ico logo-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg>QuietNet</div>
    <span id="pill" class="pill">Starting…</span>
    <span class="spacer"></span>
    <button class="btn ghost appearance-link" data-act="appearance"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Appearance</button>
  </header>
  <nav class="tabs" aria-label="Sections">
    <button class="tab" data-act="tab" data-tab="home"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>Devices</button>
    <button class="tab" data-act="tab" data-tab="groups"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.5 3.2-5.5 6.5-5.5s5.9 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c2 .7 3.2 2.5 3.5 5.2"/></svg>Groups</button>
    <button class="tab" data-act="tab" data-tab="schedules"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Schedules</button>
    <button class="tab" data-act="tab" data-tab="rules"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>Blocked list</button>
    <button class="tab" data-act="tab" data-tab="setup"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Set up a device</button>
  </nav>
  <section class="strip" id="strip" aria-label="The last 24 hours"></section>
  <section class="house" aria-label="Whole house">
    <div class="pause-box" id="pauseBox">
      <h2 class="house-title">Advert blocking</h2>
      <p class="house-note">Something stopped working? Pause it for a moment and see if that fixes it.</p>
      <button class="btn" id="pauseBtn" data-act="pause"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg>Pause advert blocking for 10 minutes</button>
    </div>
    <div class="kill-box" id="killBox">
      <h2 class="house-title"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></svg>Kill switch</h2>
      <p class="house-note" id="killNote">Stops the internet for every device that uses QuietNet, until you turn it back on.</p>
      <button class="btn danger-outline" id="killBtn" data-act="kill" aria-haspopup="dialog" aria-describedby="killNote">Stop all internet&hellip;</button>
      <p class="house-note small">You will be asked to confirm.</p>
    </div>
  </section>
  <div class="content"><div id="banners"></div><main id="view"></main></div>
</div>
<div id="modal" class="modal" hidden></div>

<script>
/* QuietNet dashboard. One page, no build step, no outside scripts. Notes for whoever edits it next:

   HOW IT IS ORGANISED
   - S (just below) is the only state: which tab is open, and the latest answers from the server.
   - api(path, body) is the only way the page talks to the server. No body = a read; a body = a change.
   - Each view...() function returns the HTML text for one screen, built from S. render() picks the
     right one and puts it on the page. softRender() does the same on the 4-second timer, but leaves
     the page alone while someone is typing or has a list open.
   - refresh() fetches only what the open tab needs, then renders.
   - Buttons carry data-act="name"; one click listener at the bottom looks the name up in `actions`.
     To add a button: give it data-act (plus any data-... values it needs) and add a function to `actions`.
   - Switches, selects and text boxes are handled by the "change" and "input" listeners at the bottom.
   - The markup uses shared class names only, never colours or inline styles: each of the three looks
     (themes) in the style sheet lays the same markup out its own way.
   - One card per device. A card is known by its key (keyOf): the device's number where the Pi gave
     one, else the address it is listed under. Buttons carry the key as data-device; S.device is the
     key of the open card. Addresses are things a device has for a while, never who it is.
   - Merge and Separate never happen on the first ask. The Pi answers with what would apply to each
     hardware address afterwards (askPreview shows it), and only the confirm, which sends the
     preview's marker back, changes anything.

   THE ONE RULE THAT MUST NOT BE BROKEN
   Every value that came from the server or from a person goes through esc() (or num() for numbers)
   before it is put into HTML. Device names, host names reported by the network, and web addresses
   are all chosen by someone else. Through the relay, even ids and counts come from a Pi that the
   relay does not control. An unescaped value is a way to run someone else's script on this page.

   LOCAL AND REMOTE
   The same file is served by the Pi (server.py) and, edited slightly, by the relay (cloud/relay.py).
   The relay inserts a script after the opening head tag, setting window.QN_API_BASE, and a bar after
   the opening body tag. It finds them by plain text search, so keep exactly one of each, written
   in lower case with no attributes (and do not spell them out in comments like this one). Keep the X-QuietNet header in api(): the relay
   refuses calls without it. tests/test_packaging.py checks these.
   The look (theme) comes from the qn_theme cookie, read by the small script before the style sheet; see setTheme(). */
const S = {tab:'home', device:null, hours:24, filter:'all', search:'', sort:'n', open:new Set(),
           status:null, devices:[], activity:[], activityKey:'', activityMark:'', rules:null,
           services:[], groups:[], ctl:{}, group:null, svcOpen:false, schedules:[], edit:null, cloud:null};
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => Number(n || 0).toLocaleString();
// One card per device. A card's key is 'd' and the device's number where the Pi gave one (d.id in
// the device list, a whole number), else 'a' and the address it is listed under: an address no
// device is known for yet, or an older Pi that lists by address. S.device holds the open card's key.
const keyOf = d => Number.isInteger(d.id) ? 'd' + d.id : 'a' + d.ip;
const cardOf = key => S.devices.find(d => keyOf(d) === key);
// The number the Pi knows the device on a card by; '' when it has none.
const deviceId = key => /^d\d+$/.test(String(key)) ? String(key).slice(1) : '';
// The address a card is listed under; '' for a device that is not on the network now.
const addrOf = key => { const d = cardOf(key); return d ? String(d.ip || '') : (deviceId(key) ? '' : String(key || '').slice(1)); };
// How a change names the device on a card: by the device's number where the Pi gave one (names,
// groups and rules are held against the device, so the number is what the Pi goes by), and by the
// card's address as well where it has one (that is all an older Pi understands).
const byDevice = key => { const ip = addrOf(key), id = deviceId(key), out = {}; if(ip) out.ip = ip; if(id) out.device = id; return out; };
// The scope a device's own rules are kept under: 'dev:12' where the Pi lists by device, else
// 'device:<address>' (an older Pi, or an address no device is known for yet).
const scopeOf = key => { const id = deviceId(key); return id ? 'dev:' + id : 'device:' + addrOf(key); };
// Run when a fresh device list arrives, for the open card. A card known by its address ('a' key)
// is given a number by the Pi the first time it is named or given a rule: the open card follows it
// to its new key. A device that is no longer listed (merged into another from a second browser,
// or forgotten) has no page to show, so the list is shown instead.
function rekey(){
  if(!S.device || cardOf(S.device)) return;
  if(deviceId(S.device)){ S.device = null; return; }
  const ip = String(S.device).slice(1), d = S.devices.find(x => x.ip === ip);
  if(d) S.device = keyOf(d);
}
// Is this schedule for this scope? The Pi gives a device's schedule with the device's number
// (x.device) and with its scope written the older way ('device:<address>').
const forScope = (x, scope) => x.scope === scope || (x.device != null && scope === 'dev:' + x.device);

// The three looks. The choice is a display preference kept in a cookie for a year; it is checked
// against this list wherever it is read, and anything else means calm. It never reaches the server's API.
const THEMES = ['calm', 'household', 'control'];
const THEME_CHOICES = [
  ['calm', 'Calm', 'Plain and quiet, with the sections down the side. Follows your device\'s light or dark setting.'],
  ['household', 'Household', 'Warmer and roomier, with devices and groups shown as large cards. Follows light or dark.'],
  ['control', 'Control room', 'Dark and compact, with the day\'s figures across the top. Always dark.']];
function currentTheme(){ const t = document.documentElement.getAttribute('data-theme'); return THEMES.indexOf(t) >= 0 ? t : 'calm'; }
function setTheme(t){
  if(THEMES.indexOf(t) < 0) t = 'calm';
  document.documentElement.setAttribute('data-theme', t);
  document.cookie = 'qn_theme=' + t + '; Path=/; Max-Age=31536000; SameSite=Lax' + (location.protocol === 'https:' ? '; Secure' : '');
}

// Small line icons. They are decoration beside words, so screen readers skip them.
const svg = (paths, cls) => `<svg class="ico${cls ? ' ' + cls : ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
const ICON = {
  back: svg('<path d="M15 6l-6 6 6 6"/>'),
  go: svg('<path d="M9 6l6 6-6 6"/>', 'go'),
  device: svg('<rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18h2"/>'),
  slash: svg('<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>'),
  x: svg('<path d="M6 6l12 12M18 6L6 18"/>'),
  moon: svg('<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>'),
};

// Empty when opened directly on the Pi; set to "/pi/<id>" by the cloud relay so the
// very same dashboard drives a remote Pi. The relay also needs a header it can check.
const BASE = (window.QN_API_BASE || '').replace(/\/$/, '');
async function api(path, body){
  const opts = body === undefined ? {headers:{}} :
    {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)};
  opts.headers = Object.assign({'X-QuietNet': '1'}, opts.headers || {});
  const r = await fetch(BASE + path, opts);
  const j = await r.json().catch(() => ({}));
  if(!r.ok){
    // The status and the answer go with the error, for a caller that acts on one kind of refusal:
    // 404 means the Pi has no such call (an older QuietNet reached through the relay), 409 that a
    // preview is out of date or that a name is needed and the person has not yet said they are sure
    // (see blockAddress). Everything else shows e.message as before.
    const e = new Error(j.error || 'Something went wrong. Is QuietNet still running?');
    e.status = r.status; e.answer = j;
    throw e;
  }
  return j;
}
function ago(ts){
  if(!ts) return 'never';
  const s = Date.now()/1000 - ts;
  if(s < 60) return 'just now';
  if(s < 3600) return Math.round(s/60) + ' min ago';
  if(s < 86400) return Math.round(s/3600) + ' hr ago';
  return Math.round(s/86400) + ' days ago';
}
function groupName(id){ return (S.groups.find(g => g.id === id) || {}).name || 'Group'; }
function deviceName(d){
  return d.name || (d.this_computer ? 'This computer' : (d.hint || (d.kind === 'hub' ? 'Your router' : 'Unnamed device')));
}
// Pickers list devices by name, in name order. Two that show the same name (two "Unnamed device",
// say) are told apart by the address each is listed under, or failing that its hardware address.
// What comes back is plain text: the caller escapes it.
function pickerLabel(d){
  const name = deviceName(d);
  if(S.devices.filter(x => deviceName(x) === name).length < 2) return name;
  return name + ' (' + (d.ip || macsOf(d)[0] || 'not on your network now') + ')';
}
function byName(list){
  return [...list].sort((a, b) => deviceName(a).localeCompare(deviceName(b)) || String(a.ip || '').localeCompare(String(b.ip || '')));
}
// A device's hardware addresses: d.macs from a Pi that lists by device, else the one in d.mac.
function macsOf(d){ return Array.isArray(d.macs) && d.macs.length ? d.macs : (d.mac ? [d.mac] : []); }
// What a card says under the name, already escaped: the address the device is listed under (or
// that it is not on the network now), how many more it has now ("and 3 IPv6 addresses": the list
// is on its page), any name the network gave it beside its own, and its hardware address or addresses.
function addressWords(d, withHint){
  const ip = String(d.ip || ''), isV6 = a => String(a).indexOf(':') >= 0;
  const now = (d.addresses || []).filter(a => a.now && a.address !== ip);
  const v6 = now.filter(a => isV6(a.address)).length, v4 = now.length - v6, more = [];
  if(v4) more.push(num(v4) + ' more IPv4 address' + (v4 === 1 ? '' : 'es'));
  if(v6) more.push(num(v6) + (ip && !isV6(ip) ? '' : ' more') + ' IPv6 address' + (v6 === 1 ? '' : 'es'));
  return (ip ? esc(ip) : 'Not on your network now')
    + (more.length === 2 ? ', ' + more[0] + ' and ' + more[1] : more.length ? ' and ' + more[0] : '')
    + (withHint ? ' · ' + esc(d.hint) : '')
    + (macsOf(d).length ? ' · ' + macsOf(d).map(esc).join(', ') : '');
}
// Is the name shown for this device one the network suggested, rather than one someone gave it?
function suggested(d){ return !d.name && !d.this_computer && !!d.hint; }
// A device nobody has named and the network gave no name for: it is shown with a device outline.
function unknownDevice(d){ return !d.name && !d.this_computer && !d.hint; }
// Up to two capital letters for a round "avatar": the first letter of each of the first two words.
function initials(name){
  return String(name || '').trim().split(/\s+/).filter(Boolean).slice(0, 2).map(w => Array.from(w)[0]).join('').toUpperCase();
}
function avatar(d, extra){
  return unknownDevice(d) ? `<span class="avatar unknown${extra || ''}" aria-hidden="true">${ICON.device}</span>`
    : `<span class="avatar${extra || ''}" aria-hidden="true">${esc(initials(deviceName(d)))}</span>`;
}
// The muted lines under a device's name when nobody has named it yet: where the suggested name came
// from and what the device said it is (or a note about it). On the device page (`inCard` false)
// there is also a "Use this name" button. On the device list each card is already a button, and a
// button can't hold another that keyboards and screen readers can reach, so there the lines are
// plain text and the card opens the device page, where the button is.
function suggestionLines(d, inCard){
  if(d.name || d.this_computer) return '';
  const via = d.hint_source === 'router' ? 'the router' : d.hint_source;
  const use = inCard ? '' : ` <button class="btn soft" data-act="usehint" data-device="${esc(keyOf(d))}">Use this name</button>`;
  return (suggested(d) ? `<span class="meta sugg">Suggested name${via ? ', found through ' + esc(via) : ''}${use}</span>` : '')
    + (d.hint_detail ? `<span class="meta sugg">${esc(d.hint_detail)}</span>` : '');
}

/* ---------- pop-up questions ----------
   Enter answers yes, and the yes button has the keyboard, unless the question is `careful`: then
   Cancel has the keyboard and Enter presses only the button it is on, so that pressing Enter twice
   (once to send a typed name, once more by habit) says no. A held-down Enter never answers at all. */
function ask({title, text, input, ok='OK', danger=false, cancel='Cancel', careful=false}){
  return new Promise(resolve => {
    const m = $('modal');
    m.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <h2>${esc(title)}</h2><p class="muted">${esc(text || '')}</p>
      ${input !== undefined ? `<input type="text" id="mInput" maxlength="40" value="${esc(input)}" aria-label="${esc(title)}">` : ''}
      <div class="row">${cancel ? `<button class="btn" id="mNo">${esc(cancel)}</button>` : ''}
      <button class="btn ${danger ? 'danger' : 'primary'}" id="mYes">${esc(ok)}</button></div></div>`;
    m.hidden = false;
    const done = v => { m.hidden = true; m.innerHTML = ''; resolve(v); };
    $('mYes').onclick = () => done(input !== undefined ? $('mInput').value : true);
    if(cancel) $('mNo').onclick = () => done(null);
    m.onkeydown = e => {
      // The Enter that opened the question may still be held down: its repeats answer nothing.
      if(e.key === 'Enter' && e.repeat){ e.preventDefault(); return; }
      if(e.key === 'Escape') done(null);
      if(e.key === 'Enter' && !careful) $('mYes').click();
    };
    (input !== undefined ? $('mInput') : careful && cancel ? $('mNo') : $('mYes')).focus();
  });
}
const oops = e => ask({title:'That didn\'t work', text:e.message, cancel:''});
// A question with more to read than ask() shows: what would apply after a merge or a separation.
// `intro` is a sentence above the lists; `blocks` a list of {head, lines:[{text, tag, cls}], none}
// (`none` is said when a block has no lines); `notes` sentences below; `buttons` a list of
// {label, value, cls}. It answers with the chosen button's value, or null for Cancel and Escape.
// Cancel has the focus and Enter confirms nothing. Every word shown comes from the Pi or from a
// person (names, hardware addresses, the Pi's own sentences), so every part goes through esc().
function askPreview({title, intro, blocks, notes, buttons}){
  return new Promise(resolve => {
    const m = $('modal');
    m.innerHTML = `<div class="card wide" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <h2>${esc(title)}</h2>${intro ? `<p class="muted">${esc(intro)}</p>` : ''}
      ${(blocks || []).map(b => `<h3>${esc(b.head)}</h3>${(b.lines || []).length
        ? `<ul class="list plan">${b.lines.map(x => `<li class="item">${esc(x.text)}${x.tag ? `<span class="badge ${esc(x.cls || 'accent')}">${esc(x.tag)}</span>` : ''}</li>`).join('')}</ul>`
        : `<p class="meta">${esc(b.none)}</p>`}`).join('')}
      ${(notes || []).map(t => `<p class="meta">${esc(t)}</p>`).join('')}
      <div class="row"><button class="btn" id="mNo">Cancel</button>
      ${(buttons || []).map((b, i) => `<button class="btn ${esc(b.cls || '')}" data-pick="${esc(i)}">${esc(b.label)}</button>`).join('')}</div></div>`;
    m.hidden = false;
    const done = v => { m.hidden = true; m.innerHTML = ''; m.onclick = null; resolve(v); };
    $('mNo').onclick = () => done(null);
    m.onclick = e => { const t = e.target.closest('[data-pick]'); if(t) done(buttons[+t.dataset.pick].value); };
    m.onkeydown = e => { if(e.key === 'Escape') done(null); };
    $('mNo').focus();
  });
}

/* ---------- top of page ---------- */
function renderChrome(){
  const st = S.status;
  document.querySelectorAll('.tabs .tab').forEach(b => {
    const on = b.dataset.tab === S.tab;
    b.classList.toggle('on', on);
    if(on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  if(!st) return;
  const pill = $('pill');
  let banners = '';
  if(!st.dns_ok){
    pill.textContent = 'Not working'; pill.className = 'pill bad';
    banners += `<div class="notice danger"><b>QuietNet couldn't start its filter.</b> Another program on this computer is
      probably already using the same connection (port ${esc(st.dns_port)}). Close QuietNet, restart the computer and
      try again. <span class="small">Technical detail: ${esc(st.dns_error)}</span></div>`;
  } else if(st.kill){
    pill.textContent = 'Internet stopped'; pill.className = 'pill bad';
    banners += `<div class="notice danger flex"><span><b>The kill switch is ON.</b> The internet is stopped for every device
      that uses QuietNet, until you turn it back on.</span>
      <button class="btn" data-act="unkill">Turn the internet back on</button></div>`;
  } else if(st.paused_for > 0){
    pill.textContent = 'Paused'; pill.className = 'pill warn';
    banners += `<div class="notice warn flex"><span><b>Advert blocking is paused</b> for another
      ${num(Math.ceil(st.paused_for/60))} min. Blocked services and switched-off devices stay blocked.</span>
      <button class="btn" data-act="resume">Turn advert blocking back on now</button></div>`;
  } else {
    pill.textContent = 'Protecting your home'; pill.className = 'pill';
  }
  const noPause = st.paused_for > 0 || !st.dns_ok || !!st.kill, noKill = !!st.kill || !st.dns_ok;
  $('pauseBox').hidden = noPause;
  $('killBox').hidden = noKill;
  document.querySelector('.house').hidden = noPause && noKill;
  document.querySelector('.shell').classList.toggle('no-house', noPause && noKill);
  if($('banners').innerHTML !== banners) $('banners').innerHTML = banners;
  // The day's figures (shown across the top by the control room look; the others show them on the Devices page).
  const t = st.today || {}, pct = t.total ? Math.round(100 * t.blocked / t.total) : 0;
  const strip = `<div class="fig"><span class="fig-label">Requests, last 24 hours</span><span class="fig-num">${num(t.total)}</span></div>
    <div class="fig"><span class="fig-label">Blocked, last 24 hours</span><span class="fig-num">${num(t.blocked)}</span></div>
    <div class="fig"><span class="fig-label">Junk share</span><span class="fig-num">${num(pct)}%</span></div>`;
  const el = $('strip');
  if(el.dataset.h !== strip){ el.innerHTML = strip; el.dataset.h = strip; }
}

/* ---------- internet switch + service blocking, for a device, a group or the whole house ---------- */
function controls(scope, what){
  const c = S.ctl[scope];
  if(!c) return '';
  const blocked = S.services.filter(v => c.services[v.id].on || c.services[v.id].from);
  const cats = [...new Set(S.services.map(v => v.cat))];
  const grid = !S.svcOpen ? '' : cats.map(cat => `<div class="cat">${esc(cat)}</div><div class="svcgrid">` +
    S.services.filter(v => v.cat === cat).map(v => {
      const x = c.services[v.id];
      if(x.from && !x.on) return `<button class="svc on" disabled>${esc(v.name)}<small>Blocked ${esc(x.from)}</small></button>`;
      return `<button class="svc ${x.on ? 'on' : ''}" data-act="svc" data-scope="${esc(scope)}" data-s="${esc(v.id)}"
        data-on="${x.on ? '' : '1'}" aria-pressed="${!!x.on}">${esc(v.name)}<small>${x.on ? 'Blocked — tap to allow' : 'Allowed'}</small></button>`;
    }).join('') + '</div>').join('');
  // A service blocked here can be allowed again from its tag; one blocked for a group or the whole
  // house is shown, with where it is blocked, but is changed there.
  const tag = v => {
    const x = c.services[v.id];
    return x.on ? `<li class="tag">${ICON.slash}<span>${esc(v.name)}</span><button class="tag-x" data-act="svc" data-scope="${esc(scope)}"
        data-s="${esc(v.id)}" data-on="" aria-label="Allow ${esc(v.name)}">${ICON.x}</button></li>`
      : `<li class="tag static">${ICON.slash}<span>${esc(v.name)} <span class="tag-from">blocked ${esc(x.from)}</span></span></li>`;
  };
  const isOff = c.off || c.off_from;
  const net = scope === 'all' ? '' : `<div class="part net">
    <div class="grow"><h2>Internet for ${what} is ${isOff ? 'OFF' : 'on'}</h2>
    <p class="meta">${c.off_from && !c.off ? 'Switched off ' + esc(c.off_from) + '.' : (c.off ? 'Switch back on to let ' + what + ' use the internet again.' : 'Switch this off to stop ' + what + ' reaching anything at all.')}</p></div>
    <label class="switch"><input type="checkbox" id="netSwitch" data-scope="${esc(scope)}" ${c.off ? '' : 'checked'} aria-label="Internet for ${what}"><span></span></label></div>`;
  const scheds = S.schedules.filter(x => forScope(x, scope)).map(x => `<div class="sched">
    <span class="avatar sm moon" aria-hidden="true">${ICON.moon}</span>
    <div class="grow"><b>${esc(x.name)}</b>${x.active ? '<span class="badge danger">On right now</span>' : ''}${x.enabled ? '' : '<span class="badge">Not in use</span>'}
      <div class="meta">${esc(daysText(x.days))}, <span class="mono">${esc(x.start)}</span> to <span class="mono">${esc(x.end)}</span>${x.start > x.end ? ' next morning' : ''} · ${esc(whatText(x))}</div></div>
    <button class="btn" data-act="schededit" data-id="${esc(x.id)}">Change</button></div>`).join('');
  return `<section class="card rules" aria-label="Rules for ${what}">${net}
    <div class="part svcs${S.svcOpen ? ' open' : ''}">
      <div class="row"><div class="grow"><h2>Block apps and services for ${what}</h2>
        <p class="meta">${blocked.length ? 'Blocked:' : 'Nothing blocked.'}</p></div>
        <button class="btn" data-act="svctoggle">${S.svcOpen ? 'Done' : 'Choose services'}</button></div>
      ${blocked.length ? `<ul class="chips">${blocked.map(tag).join('')}</ul>` : ''}${grid}</div>
    <div class="part sched-part"><h2>Schedules</h2>${scheds}
      <p class="meta">Want this to happen automatically, like at bedtime?
        <button class="btn link" data-act="schednew" data-scope="${esc(scope)}">Set a schedule</button></p></div>
    <p class="part foot meta">Blocks, schedules and the kill switch take a couple of minutes to bite.</p></section>`;
}

/* ---------- Devices (home) ---------- */
function viewHome(){
  const st = S.status || {today:{}};
  const today = st.today || {};
  const pct = today.total ? Math.round(100 * today.blocked / today.total) : 0;
  const tiles = S.devices.map(d => `
    <button class="tile" data-act="open" data-device="${esc(keyOf(d))}">
      ${avatar(d)}
      <span class="tile-main"><span class="name">${esc(deviceName(d))}</span>
        <span class="meta addr">${addressWords(d, !!(d.hint && d.name))}</span>
        ${suggestionLines(d, true)}${sameAsLine(d)}</span>
      <span class="tile-figs">${d.last
        ? `${num(d.n)} requests today · <b>${num(d.nb)} blocked</b> · active ${esc(ago(d.last))}`
        : '<span class="muted">Not using QuietNet yet</span>'}</span>
      <span class="tile-badges">${d.off ? '<span class="badge danger">Internet off</span>' : ''}${d.enforced ? '<span class="badge accent">Live-enforced</span>' : ''}${d.paused ? '<span class="badge warn">Rules paused</span>' : ''}${d.other_dns ? '<span class="badge warn">Tried another DNS service</span>' : ''}${v6Bypass(d) ? '<span class="badge warn">Can bypass over IPv6</span>' : ''}${byNumberOnly(d) ? '<span class="badge">Recognised by its number</span>' : ''}${askedAbout(d) ? '<span class="badge warn">Same device?</span>' : ''}${d.group ? `<span class="badge">${esc(groupName(d.group))}</span>` : ''}</span>
      ${ICON.go}
    </button>`).join('');
  const scanning = st.scan && st.scan.state === 'scanning';
  return `
  ${v6Warning(true)}
  ${v6NeighbourNotice()}
  ${firewallNotice()}
  ${devicesNotice()}
  ${movedNotices(null)}
  ${deviceEvents()}
  ${moveReport()}
  <div class="card">
    <div class="row">
      <div class="grow"><h2>Block known adverts and trackers automatically</h2>
      <p class="meta">QuietNet knows about ${num(st.junk_count)} junk addresses.
        ${st.community && !st.community.installed ? '<button class="btn link" data-act="tab" data-tab="rules">Get the full list</button>' : ''}</p></div>
      <label class="switch"><input type="checkbox" id="junkSwitch" ${st.junk_on ? 'checked' : ''} aria-label="Block known adverts and trackers automatically"><span></span></label>
    </div>
    ${otherDnsSwitch(st)}
    <div class="home-stats">
      <div class="stat"><b>${num(today.total)}</b><span>requests in the last 24 hours</span></div>
      <div class="stat"><b>${num(today.blocked)}</b><span>blocked</span></div>
      <div class="stat"><b>${num(pct)}%</b><span>of traffic was junk</span></div>
    </div>
  </div>
  <div class="row section-head"><div class="grow"><h2>Your devices</h2>
    <p class="meta">One card for each device, whatever addresses it has had. Pick a device to see what it has been
      talking to, or to block things for it.</p></div>
    <button class="btn" data-act="scan" ${scanning ? 'disabled' : ''}>${scanning ? 'Looking… (about 10 seconds)' : 'Find devices on my network'}</button></div>
  ${st.scan && st.scan.capped ? `<p class="meta">Your network is large, so only the ${num(st.scan.addresses)} addresses nearest this computer ${scanning ? 'are being' : 'were'} checked.
    Devices further away appear here once they use QuietNet.</p>` : ''}
  ${tiles ? `<div class="thead" aria-hidden="true"><span>Device</span><span>Today</span><span></span></div><div class="tiles">${tiles}</div>` : `<div class="card empty">
    <p><b>No devices yet.</b></p><p>QuietNet can only see devices that have been pointed at it.</p>
    <button class="btn primary" data-act="tab" data-tab="setup">Show me how to set up a device</button></div>`}`;
}

// A device the Pi knows only by a network address (d.kind 'addr' with a number of its own): it is
// behind a Wi-Fi range extender, or no hardware address was ever seen for it. Its page says which.
function byNumberOnly(d){ return d.kind === 'addr' && Number.isInteger(d.id); }

// The household setting "Stop every device using another DNS service". st.other_dns_all is true or
// false. Off, only devices with rules of their own (or a group, or "cut live connections") are kept
// away from other DNS services, because a device set up to use one strictly loses all names.
function otherDnsSwitch(st){
  return `<div class="row"><div class="grow"><h2>Stop every device using another DNS service</h2>
    <p class="meta">Devices with rules of their own are always stopped from using another DNS service (such as Google's or
      Cloudflare's) to get round QuietNet. Turn this on to stop every device. A phone or computer set to use one of those
      services, rather than "automatic", will then have no internet at home until its setting is changed.</p></div>
    <label class="switch"><input type="checkbox" id="otherDnsSwitch" ${st.other_dns_all ? 'checked' : ''} aria-label="Stop every device using another DNS service"><span></span></label></div>`;
}

/* ---------- IPv6: saying honestly what QuietNet can't see ---------- */
// d.v6_bypass comes from the Pi: true while the home network has IPv6, or while something in the
// home names an IPv6 DNS server that is not QuietNet, for every device but the Pi itself, steered
// or not ("Cut live connections" covers IPv4 only). Shown only for a device that uses QuietNet;
// one that doesn't is already marked "Not using QuietNet yet".
function v6Bypass(d){ return !!(d.v6_bypass && d.last); }
// The notice says "IPv6 is on in your home" only when the Pi says so (in_use). A router with no
// IPv6 internet can still name its own IPv6 DNS server; then the notice says that instead.
function v6BypassNotice(d){
  if(!v6Bypass(d)) return '';
  const why = ((S.status || {}).ipv6 || {}).in_use
    ? `IPv6 is on in your home, and your router gives every device its own IPv6 DNS server. So this device can look
    names up, and connect, without QuietNet seeing or blocking it.`
    : `Something in your home, most likely your router, tells every device to use an IPv6 DNS server that is not
    QuietNet. So this device can look names up without QuietNet seeing or blocking them.`;
  return `<div class="notice warn"><b>This device can bypass QuietNet over IPv6.</b> ${why}${d.enforced ? ' "Cut live connections" covers IPv4 only, so it does not close this.' : ''}
    The sure fix is to switch IPv6 off on your router.
    <button class="btn link" data-act="tab" data-tab="setup">Show me how</button></div>`;
}
// d.same_as is a hint from the Pi for a card filed under an IPv6 address it could not match to a
// device: the number of the device whose hardware address that IPv6 address was built from. It is
// only ever shown. No rule is applied from it, because any device can make itself such an address.
function sameAsCard(d){ return S.devices.find(x => x.ip === d.same_as); }
function sameAsName(d){
  const other = sameAsCard(d);
  return (other ? deviceName(other) + ' (' + d.same_as + ')' : d.same_as);
}
function sameAsLine(d){
  return d.same_as ? `<span class="meta sugg">Probably the same device as ${esc(sameAsName(d))}</span>` : '';
}
function sameAsNotice(d){
  if(!d.same_as) return '';
  return `<div class="notice info">This is probably <b>${esc(sameAsName(d))}</b> asking over IPv6: this IPv6 address looks as
    if it was built from that device's hardware address. QuietNet could not confirm it, and any device can make itself
    such an address, so that device's rules are not applied here.
    ${sameAsCard(d) ? `<button class="btn link" data-act="open" data-device="${esc(keyOf(sameAsCard(d)))}">Open it</button>` : ''}</div>`;
}
// Shown on the home page when the Pi can't read its list of IPv6 neighbours, which is how it tells
// which device a lookup over IPv6 came from. Only while it is taking lookups over IPv6.
function v6NeighbourNotice(){
  const v6 = (S.status || {}).ipv6 || {};
  if(v6.neighbours_ok !== false || !v6.taking_lookups) return '';
  return `<div class="notice warn"><b>QuietNet can't tell which device a lookup over IPv6 came from.</b> It could not read
    this computer's list of IPv6 neighbours. While any device has rules of its own, is in a group or has "Cut live
    connections" on, lookups over IPv6 are refused, and devices fall back to their other DNS server. On a Raspberry Pi,
    running the install command again puts the missing tool back.</div>`;
}
// What the Pi has to say about bringing an older household's data up to date (st.devices):
//  - notice: too little free space, or a move that failed. Nothing was changed in either case.
//  - conflicts: rules the move set aside, because the same device had rules under two numbers and
//    these were not the ones applying to it. They apply to no device until the owner chooses;
//    nothing is dropped or applied without being asked. The text says which were which.
//  - old_rules: an older QuietNet was run on this data afterwards and left names, groups or rules
//    where this version no longer reads them. The owner is offered to bring them in.
//  - report: what the move of rules did, in plain words, kept to read later.
// An older Pi sends no st.devices, or none of the last three, and then nothing is shown for them.
function devicesNotice(){
  const dv = (S.status || {}).devices || {};
  const choose = (c, choice, label, cls) =>
    `<button class="btn${cls}" data-act="conflict" data-id="${esc(c.id)}" data-choice="${choice}">${label}</button>`;
  return (dv.notice ? `<div class="notice warn">${esc(dv.notice)}</div>` : '')
    + (dv.old_rules ? `<div class="notice warn"><b>An older version of QuietNet has been run on your data</b>, and names,
      groups or rules were set there for ${num(dv.old_rules)} number${dv.old_rules === 1 ? '' : 's'}. This version is not
      using them. <button class="btn" data-act="oldrules">Bring them in</button></div>` : '')
    + (dv.conflicts || []).map(c => `<div class="notice warn"><b>Rules that need your decision.</b> ${esc(c.text)}
      Give them to the device and they are added to its own rules. Leave them with the number and they apply to
      whichever other device has that number.
      ${choose(c, 'give', 'Give them to the device', ' primary')}${choose(c, 'remove', 'Remove them', '')}${choose(c, 'keep', 'Leave them with the number', ' link')}</div>`).join('');
}
// What the move of names, groups and rules to the devices did, line by line, for the owner to read.
function moveReport(){
  const lines = ((S.status || {}).devices || {}).report || [];
  if(!lines.length) return '';
  return `<div class="card"><h2>What changed when your rules were moved to the devices</h2><ul class="list">${lines.map(line =>
    `<li class="item"><div class="meta">${esc(line)}</div></li>`).join('')}</ul></div>`;
}
// The optional household setting "Give no device IPv6 addresses". st.no_ipv6_all is true or false;
// off unless the owner turns it on, because it changes what every device is told. Through the relay
// the Pi may be an older QuietNet without the switch (no st.no_ipv6_all): then it is not offered.
function noIpv6Switch(st){
  if(st.no_ipv6_all == null) return '';
  return `<div class="row"><div class="grow"><h2>Give no device IPv6 addresses</h2>
    <p class="meta">Off unless you turn it on. QuietNet then answers "none" whenever a device asks it for a name's IPv6
      addresses, so apps connect over IPv4, where blocks and "Cut live connections" work. It only helps for lookups that
      reach QuietNet, and a site that works over IPv6 only would stop working. Names of things in your own home are not
      affected. Turn it off again at any time; devices pick that up within a couple of minutes.</p></div>
    <label class="switch"><input type="checkbox" id="noIpv6Switch" ${st.no_ipv6_all ? 'checked' : ''} aria-label="Give no device IPv6 addresses"><span></span></label></div>`;
}
// The setting "Take IPv6 away from devices you cut live connections for" (design option c2).
// st.ipv6_steer is true or false; off unless the owner turns it on, because it changes those
// devices' network. Through the relay the Pi may be an older QuietNet without it (no st.ipv6_steer):
// then it is not offered.
function ipv6SteerSwitch(st){
  if(st.ipv6_steer == null) return '';
  const v6 = (st.enforcer || {}).ipv6_steering || {};
  const meta = `<p class="meta">Off unless you turn it on, and only for devices you have "Cut live connections" on for. QuietNet
      tells each of those devices that it, not the hub, is the way out for IPv6, and answers their lookups with no IPv6
      addresses, so they use IPv4, where your blocks and cuts work. It leaves every other device alone, changes nothing
      lasting on the Pi, and never touches a device behind a range extender. Turn it off to stop at once and hand the
      devices straight back to the hub; without the Pi they also right themselves within a minute or two.</p>`;
  if(v6.offered !== true){
    return `<div class="row"><div class="grow"><h2>Take IPv6 away from steered devices</h2>${meta}
      <p class="small muted">Not available on this computer: it needs the nft firewall tool and "Cut live connections" working.</p></div></div>`;
  }
  let note = '';
  if(st.ipv6_steer){
    if(v6.problem) note = `<p class="small muted">${esc(v6.problem)}</p>`;
    else if(!v6.hub_known) note = `<p class="small muted">Waiting to hear the hub announce IPv6; nothing is being changed yet.</p>`;
    else note = `<p class="small muted">Taking IPv6 away from ${num(v6.steered)} device${v6.steered === 1 ? '' : 's'} now.</p>`;
  }
  return `<div class="row"><div class="grow"><h2>Take IPv6 away from steered devices</h2>${meta}${note}</div>
    <label class="switch"><input type="checkbox" id="ipv6SteerSwitch" ${st.ipv6_steer ? 'checked' : ''} aria-label="Take IPv6 away from steered devices"><span></span></label></div>`;
}
// What QuietNet knows about IPv6 on the home network, for "Set up a device". v6.hub_off is true only
// after the Pi has listened for a full hour while able to hear the router, heard no router announce
// IPv6, holds no public IPv6 address itself, and nothing in the home names an IPv6 DNS server other
// than QuietNet; a Pi that is not listening, or was restarted, never shows it. The order matters:
// "off" only on the Pi's word; then "on"; then a DNS server still being named (v6.router_dns_not_ours),
// which means devices can bypass even with no IPv6 internet; then the "can't tell" cases; and only
// then "Still checking". v6.can_hear is false when IPv6 is switched off on the Pi's own network
// card (it then hears nothing, which is not the same as nothing being said) and null when the Pi
// could not find out. Through the relay the Pi may be an older QuietNet that sends no listening_for
// (that counts as "can't tell" too) or no can_hear (then the page says what it always did).
function hubIpv6State(v6){
  if(v6.hub_off) return `<div class="notice info"><b>IPv6 is off on your hub.</b> QuietNet has listened for over an hour,
    heard no IPv6 announcement from your router, and has no public IPv6 address itself. Devices can't use IPv6 to get
    round QuietNet.</div>`;
  if(v6.in_use) return `<div class="notice warn"><b>IPv6 is on in your home.</b> Your router gives devices IPv6
    addresses and, on a BT Smart Hub, its own IPv6 DNS server, which can't be changed. Devices that use it bypass
    QuietNet, whatever DNS you set on them. They are marked "Can bypass over IPv6" on the Devices page.</div>`;
  if((v6.router_dns_not_ours || []).length) return `<div class="notice warn"><b>Something in your home still names an IPv6
    DNS server that is not QuietNet</b> (${v6.router_dns_not_ours.map(a => '<b>' + esc(a) + '</b>').join(', ')}). Devices
    that use it send their lookups past QuietNet, so QuietNet can't say IPv6 is off. They are marked "Can bypass over IPv6"
    on the Devices page. This is most likely your router: it can go on naming its own DNS server after it stops giving
    out IPv6 internet addresses. On a BT Smart Hub that can happen while <b>ULA Enabled</b> is on, so if you have set
    Allocation Mode to Off, turn ULA Enabled off as well. The notice goes within an hour of the server no longer being named.</div>`;
  if(!v6.listening || v6.listening_for == null) return `<p class="meta">QuietNet can't tell from here whether IPv6 is on.
    It can only listen for the router's IPv6 announcements when it runs on a Raspberry Pi.</p>`;
  if(v6.can_hear === false) return `<div class="notice warn"><b>QuietNet can't tell whether IPv6 is on in your home.</b>
    IPv6 is switched off on this computer's own network connection, so it can't hear your router's IPv6 announcements.
    That is not the same as your router being silent: devices may still be using IPv6 to get round QuietNet, and
    QuietNet can't mark them "Can bypass over IPv6" while it can't hear. To let it check, switch IPv6 back on for the
    Raspberry Pi itself; it then needs a full hour of listening. Or look at the IPv6 page in your router's own settings.</div>`;
  if(v6.can_hear === null) return `<p class="meta"><b>QuietNet can't tell yet whether IPv6 is on.</b> It has not been able to
    check that this computer's own network connection can hear your router's IPv6 announcements. That check is made
    every minute or so; the hour of listening starts once it passes.</p>`;
  const left = Math.ceil((3600 - (v6.listening_for || 0)) / 60);
  return `<p class="meta"><b>Still checking.</b> QuietNet has not heard your router announce IPv6. It only says "IPv6 is
    off on your hub" after listening for a full hour without a break${left > 0 ? ': about ' + num(left) + ' min to go' : ''}.
    Restarting QuietNet starts the hour again.</p>`;
}

/* ---------- Another firewall in the way ---------- */
// Shown on the home page when another firewall on the Pi (usually Docker's) stops "Cut live
// connections" for every device. e.firewall comes from Enforcer.firewall_fix: blocked_by, commands,
// and installer (true when running the install command again makes the fix last). Every part is escaped.
function firewallNotice(){
  const fw = ((S.status || {}).enforcer || {}).firewall;
  if(!fw || !(fw.commands || []).length) return '';
  return `<div class="notice danger"><b>"Cut live connections" is not working for any device.</b>
    Another firewall on the Pi (${(fw.blocked_by || []).map(esc).join(', ')}) blocks the traffic QuietNet passes on,
    so QuietNet is leaving every device alone rather than cut it off. To fix it now, run this on the Pi:
    <code>${esc(fw.commands.join(' && '))}</code>
    A command run like this lasts until the next restart.
    ${fw.installer ? 'Re-running the install command sets this up permanently.'
      : 'To make it permanent, add the same rule to that firewall\'s own saved settings.'}</div>`;
}

/* ---------- Devices that change address, or come back with a new hardware address ---------- */
// Rules are held against the device, by its hardware address. A phone told to forget the network
// comes back with a new private Wi-Fi address, so as a new device. st.device_notices are the Pi's
// questions about that. On the home page every notice is shown; on a device's page (its card's key
// given) only those about it, as the newcomer or as the device the rules belong to. Each carries
// the two devices' numbers (n.from_device, n.to_device), which the answer sends back; an older Pi
// sends only the addresses. QuietNet never merges two devices by itself: "yes" opens the same
// preview as "Merge with" on a device's page (see mergeFlow), and nothing changes until it is confirmed.
// n.same: the newcomer already gets the other device's rules for now, and the owner says whether
// it is the same device. n.held: those rules were kept under a number alone (QuietNet could not
// tell which device had it), and a device it can tell apart now has that number. n.extender: the
// number is now answered for by a Wi-Fi range extender, so the device there can't be told apart
// or joined to another; the only answer is "no".
// Otherwise it is only a suggestion: a device with rules went quiet just as a new one appeared.
const noticeKey = n => n.to_device == null ? 'a' + n.to : 'd' + n.to_device;
// Is one of those questions about the device on this card (as the newcomer, or as the device the
// rules belong to)? Its card then carries a "Same device?" badge, and its page the question.
const aboutCard = (n, key) => noticeKey(n) === key || (n.from_device != null && 'd' + n.from_device === key);
function askedAbout(d){ return ((S.status || {}).device_notices || []).some(n => aboutCard(n, keyOf(d))); }
function movedNotices(key){
  const list = ((S.status || {}).device_notices || []).filter(n => !key || aboutCard(n, key));
  const ids = n => n.to_device == null ? '' : ` data-todev="${esc(n.to_device)}" data-fromdev="${esc(n.from_device)}"`;
  const open = n => key ? '' : `<button class="btn link" data-act="open" data-device="${esc(noticeKey(n))}">Open it</button>`;
  return list.map(n => n.same && n.extender
    ? `<div class="notice warn"><b>The device at ${esc(n.to)} now connects through a Wi-Fi range extender</b>, so QuietNet
    can't tell which device it is. That was ${esc(n.name)}'s number, so the rules for ${esc(n.name)} still apply to it.
    <button class="btn" data-act="notsame" data-ip="${esc(n.to)}"${ids(n)}>It's a different device</button>
    ${open(n)}</div>`
    : n.same && n.held
    ? `<div class="notice warn"><b>Rules are kept under the number ${esc(n.to)}</b>, set before QuietNet could tell which
    device has it. A device it can tell apart has that number now, and the rules apply to it for now. Are they for this device?
    <button class="btn primary" data-act="moverules" data-from="${esc(n.from)}" data-to="${esc(n.to)}"${ids(n)}>Yes, they are this device's</button>
    <button class="btn" data-act="notsame" data-ip="${esc(n.to)}"${ids(n)}>No, they are for another device</button>
    ${open(n)}</div>`
    : n.same
    ? `<div class="notice warn"><b>A device with a new private Wi-Fi address now has the number ${esc(n.to)}</b>,
    which ${esc(n.name)} had. It may be the same device, so its rules still apply. Is it ${esc(n.name)}?
    <button class="btn primary" data-act="moverules" data-from="${esc(n.from)}" data-to="${esc(n.to)}"${ids(n)}>Yes, it's the same device</button>
    <button class="btn" data-act="notsame" data-ip="${esc(n.to)}"${ids(n)}>No, it's a different device</button>
    ${open(n)}</div>`
    : `<div class="notice warn"><b>A device with rules (${esc(n.name)}) has gone quiet and a new device appeared</b>
    at ${esc(n.to)}. It may be the same one with a new private Wi-Fi address. Same device?
    <button class="btn primary" data-act="moverules" data-from="${esc(n.from)}" data-to="${esc(n.to)}"${ids(n)}>It's the same device</button>
    ${open(n)}</div>`).join('');
}
// The warning on a device's page (it may be another device with a new hardware address, it is
// behind a range extender, or its hardware address is at two numbers). On a Pi that still keeps
// rules under addresses (an older one, or one that has not yet brought its data up to date), a
// paused address offers "It's the same device": the rules kept under the number then apply to
// the device that has it now. Nothing is joined there, so it has its own question (samehere).
function deviceWarning(d){
  if(!d.warning) return '';
  return `<div class="notice warn">${esc(d.warning)}${d.paused
    ? ` <button class="btn" data-act="samehere" data-ip="${esc(d.ip)}">It's the same device</button>` : ''}</div>`;
}
// What QuietNet did by itself to devices' rules in the last week (moved, paused, new-device group).
function deviceEvents(){
  const ev = (S.status || {}).device_events || [];
  if(!ev.length) return '';
  return `<div class="card"><h2>Recent changes to devices</h2><ul class="list">${ev.slice(0, 5).map(e =>
    `<li class="item"><div class="meta">${esc(e.text)} · ${esc(ago(e.ts))}</div></li>`).join('')}</ul></div>`;
}

/* ---------- One device ---------- */
// Shown when the device looked up another DNS service (secure DNS in a browser, Private DNS on a
// phone): d.other_dns is when it last did, from the device list; the activity list shows older tries.
function otherDnsNotice(d){
  if(!d.other_dns && !S.activity.some(g => g.other_dns)) return '';
  return `<div class="notice warn"><b>This device tried to use another DNS service</b>${d.other_dns ? ' ' + esc(ago(d.other_dns)) : ''},
    which would let it get round QuietNet. QuietNet stopped it. Check its settings: on Android, Private DNS should be Off
    or Automatic; in Chrome, Edge or Firefox, secure DNS (DNS over HTTPS) should be off.</div>`;
}
// Blocked things whose addresses are shared with sites this device is allowed (Google's front doors
// serve YouTube and Classroom alike) are left to the name block, so allowed sites keep working.
// e.shared[ip] is {count, names} from enforcement_plan; every part is escaped.
function sharedNote(d, e){
  const sh = (e.shared || {})[d.ip];
  if(!d.enforced || !sh || !sh.count) return '';
  const names = (sh.names || []).map(esc);
  const who = names.length ? (names.length > 1 ? names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1] : names[0]) : 'the blocked sites';
  return `<p class="small muted">Some of ${who}'s addresses are shared with sites this device is allowed, so those connections are left to the name block
    (${num(sh.count)} ${sh.count === 1 ? 'address' : 'addresses'}). New connections to them are still blocked.</p>`;
}
function enforceCard(d){
  const e = (S.status || {}).enforcer || {};
  if(!d.last) return '';                       // device isn't using QuietNet yet, nothing to enforce
  if(!e.available) return `<div class="card"><h2>Cut live connections</h2>
    <p class="meta">${esc(e.reason || "Not available on this computer.")}</p></div>`;
  return `<div class="card"><div class="row">
    <div class="grow"><h2>Cut live connections${d.enforced ? '<span class="badge danger">On</span>' : ''}</h2>
    <p class="meta">Normally a block only stops new connections. Turn this on and blocks, bedtimes and the kill switch
      also stop things that are <b>already running</b> on this device (like a Disney+ video mid-stream). QuietNet steers this
      device through itself and drops only what's blocked for it. Takes a few seconds to bite.</p>
    ${((S.status || {}).ipv6 || {}).in_use ? `<p class="small muted">This covers IPv4 only, and IPv6 is on in your home. QuietNet gives this
      device no IPv6 addresses in its own answers, so most apps connect over IPv4. But lookups the device sends to the router's
      own IPv6 DNS server, and anything it reaches over IPv6, are not seen or cut.</p>` : ''}
    ${d.enforced && (e.problem || (e.problems || {})[d.ip]) ? `<p class="small err-text"><b>Not working yet:</b> ${esc(e.problem || e.problems[d.ip])}</p>` : ''}
    ${d.enforced && ((e.ipv6_steering || {}).problems || {})[d.ip] ? `<p class="small muted">${esc(e.ipv6_steering.problems[d.ip])}</p>` : ''}
    ${sharedNote(d, e)}</div>
    <label class="switch"><input type="checkbox" id="enforceSwitch" ${d.enforced ? 'checked' : ''} aria-label="Cut live connections for this device"><span></span></label></div></div>`;
}

/* ---------- names a device's own system needs ----------
   The server keeps a short list of names that a kind of device needs for its sign-in, app shop,
   online check, clock or updates, and sends who needs each as `needed` ("Samsung TVs") with
   activity rows and blocked-list rows. Such a row is never called "Possibly junk"; it says who needs it.
   Blocking one is refused by the server (409, carrying `needed`) until the person has said yes:
   blockAddress() asks and sends the block again with "sure": true. The check is the server's so
   that it holds for every way of blocking, here and through the relay. */
function neededQuestion(who){
  return `${who} need this address for their own system to work. Blocking it may stop them opening apps, signing in or updating. Block it anyway?`;
}
// The line under a block that already exists on a needed name: the likely cause when a device plays up.
function neededBlockedNote(who){
  return who ? `<div class="meta">${esc(who)} need this address. If apps have stopped opening on one, or it can't sign in or update, unblock it.</div>` : '';
}
// Block an address; true if it was blocked, false if the person said no to the question.
async function blockAddress(domain){
  try{
    await api('/api/block', {domain:domain});
    return true;
  }catch(e){
    const a = e.answer || {};
    if(e.status !== 409 || !a.needed) throw e;
    const yes = await ask({title:`Block ${a.domain || domain}?`, ok:'Block it anyway', danger:true, careful:true, text:neededQuestion(a.needed)});
    if(!yes) return false;
    await api('/api/block', {domain:domain, sure:true});
    return true;
  }
}
function statusBadges(x){
  let out = '';
  if(x.v === 'junk') out += '<span class="badge danger">Advert / tracker</span>';
  // A needed name is never called "Possibly junk". The note is plain, and amber once the person has blocked the name.
  if(x.needed) out += `<span class="badge${x.b && x.why === 'you' ? ' warn' : ''}">Needed by ${esc(x.needed)}</span>`;
  else if(x.v === 'suspect') out += '<span class="badge warn">Possibly junk</span>';
  if(x.b && x.why === 'other_dns') out += '<span class="badge warn">Tried to use another DNS service</span>';
  else if(x.b) out += `<span class="badge accent">${x.why === 'you' ? 'Blocked by you' : x.why === 'service' || x.why === 'schedule' ? 'Blocked · ' + esc(x.svc)
    : x.why === 'off' ? 'Internet off' : x.why === 'kill' ? 'Kill switch' : 'Blocked automatically'}</span>`;
  else if(x.some_blocked) out += '<span class="badge accent">Partly blocked</span>';
  else if(x.why === 'allowed') out += '<span class="badge">Allowed by you</span>';
  return out;
}
// On a device page: the note for a row the person has blocked themselves, when devices need that name.
function blockedByYouNote(x){ return x.b && x.why === 'you' ? neededBlockedNote(x.needed) : ''; }
function blockBtn(x, domain){
  if(['service', 'off', 'schedule', 'kill'].includes(x.why)) return '';   // managed with the switches at the top of the page
  if(x.why === 'other_dns') return '';                                   // always blocked: see otherDnsNotice
  return x.b
    ? `<button class="btn" data-act="unblock" data-d="${esc(domain)}">Unblock</button>`
    : `<button class="btn ${x.v === 'ok' || x.needed ? '' : 'primary'}" data-act="block" data-d="${esc(domain)}" data-v="${esc(x.v)}" data-needed="${esc(x.needed || '')}">Block</button>`;
}
function activityList(){
  const q = S.search.trim().toLowerCase();
  let list = S.activity.filter(g => {
    if(S.filter === 'junk' && !(g.v !== 'ok')) return false;
    if(S.filter === 'blocked' && !(g.b || g.some_blocked)) return false;
    if(q && !(g.base.includes(q) || g.owner.toLowerCase().includes(q) || g.hosts.some(h => h.d.includes(q)))) return false;
    return true;
  });
  if(S.sort === 'last') list = [...list].sort((a,b) => b.last - a.last);
  if(!S.activity.length) return `<div class="empty">Nothing recorded for this device in this time period.</div>`;
  if(!list.length) return `<div class="empty">Nothing matches.</div>`;
  return list.map(g => {
    const open = S.open.has(g.base), many = g.hosts.length > 1 || g.hosts[0].d !== g.base;
    const hosts = open ? `<div class="hosts">${g.hosts.map(h => `
      <div class="item"><div class="top"><div class="info"><span class="title">${esc(h.d)}</span>${statusBadges(h)}
        <div class="meta">${h.n === 1 ? 'once' : num(h.n) + ' times'} · last ${esc(ago(h.last))}</div>${blockedByYouNote(h)}</div>${blockBtn(h, h.d)}</div></div>`).join('')}</div>` : '';
    return `<div class="item"><div class="top">
      <div class="info"><span class="title">${esc(g.owner || g.base)}</span>${statusBadges(g)}
        <div class="meta">${g.owner ? esc(g.base) + ' · ' : ''}contacted ${g.n === 1 ? 'once' : num(g.n) + ' times'}${g.nb ? ' (' + num(g.nb) + ' blocked)' : ''} · last ${esc(ago(g.last))}</div>${blockedByYouNote(g)}
        ${many ? `<button class="expand" data-act="expand" data-b="${esc(g.base)}" aria-expanded="${open}">${open ? 'Hide' : 'Show'} ${num(g.hosts.length)} address${g.hosts.length > 1 ? 'es' : ''}</button>` : ''}
      </div>${blockBtn(g, g.base)}</div>${hosts}</div>`;
  }).join('');
}
// The device page's record of the device: every address it has now or had in the last day, with
// when it was first and last seen there, and its hardware address or addresses. One of two or more
// hardware addresses (a laptop's cable and Wi-Fi, merged by the owner) can be separated again, and
// "Merge with" lists the other devices by name. Both show what would apply before anything is
// changed (see mergeFlow and the separate action). A Pi from before the device tables sends no
// addresses and no numbers: then the list is left out and nothing is offered. A Pi that has device
// numbers but no Merge yet is offered both, and answers 404: the actions then say that it needs
// updating. Every address, time and name is escaped.
function mergeChoices(d){
  // Never this computer or the router, and never two that are both known only by a number: the
  // Pi refuses those, since neither has a hardware address to keep the merged device together.
  const ok = x => Number.isInteger(x.id) && (x.kind === 'hw' || x.kind === 'addr');
  return ok(d) ? byName(S.devices.filter(x => ok(x) && x.id !== d.id && !(d.kind === 'addr' && x.kind === 'addr'))) : [];
}
function deviceDetails(d){
  const macs = macsOf(d), others = mergeChoices(d);
  const when = a => [a.now ? 'Here now' : (a.last ? 'Last seen here ' + esc(ago(a.last)) : ''), a.first ? 'first seen here ' + esc(ago(a.first)) : '']
    .filter(Boolean).join(' · ');
  const rows = (d.addresses || []).map(a => `<li class="item"><span class="title addr">${esc(a.address)}</span>${a.now ? '<span class="badge accent">Now</span>' : ''}
    <div class="meta">${when(a)}</div></li>`).join('');
  const canSeparate = d.kind === 'hw' && Number.isInteger(d.id) && macs.length > 1;
  const hw = macs.map(m => `<li class="item"><div class="top"><div class="info"><span class="title addr">${esc(m)}</span></div>
    ${canSeparate ? `<button class="btn" data-act="separate" data-mac="${esc(m)}" aria-haspopup="dialog">Separate&hellip;</button>` : ''}</div></li>`).join('');
  const merge = !others.length ? '' : `<div class="row group-pick"><label for="mergeSel">Merge with</label>
    <select id="mergeSel"><option value="">Choose a device</option>${others.map(x =>
      `<option value="${esc(keyOf(x))}">${esc(pickerLabel(x))}</option>`).join('')}</select>
    <button class="btn" data-act="merge" aria-haspopup="dialog">Show what would change&hellip;</button></div>
    <p class="meta">For one device that shows as two: a laptop on both cable and Wi-Fi, or a phone that came back with a
      new private Wi-Fi address. You are shown which rules would apply to each hardware address before anything is
      changed. Two devices that each have a hardware address can be taken apart again with Separate; one recognised
      only by its number can't, and the box says so before you confirm. QuietNet never merges devices by itself.</p>`;
  if(!rows && !hw && !merge) return '';
  return `<section class="card details" aria-labelledby="detailsTitle"><h2 id="detailsTitle">This device's addresses</h2>
    <p class="meta">A device is recognised by its hardware address, the label of its network card. The numbers it uses
      on your network change; its name, rules and history stay with the device.</p>
    ${rows ? `<h3>Network addresses, now and in the last day</h3><ul class="list">${rows}</ul>` : ''}
    ${hw ? `<h3>Hardware address${macs.length === 1 ? '' : 'es'}</h3><ul class="list">${hw}</ul>` : ''}
    ${canSeparate ? '<p class="meta">This is one device with more than one hardware address, because you merged them. Separate takes one out again as a device of its own, and asks whether the rules go with it.</p>' : ''}
    ${byNumberOnly(d) ? '<p class="meta">QuietNet recognises this device by its number alone: it is behind a Wi-Fi range extender, or no hardware address has been seen for it. Its name and rules stay with that number.</p>' : ''}
    ${merge}</section>`;
}
function viewDevice(){
  const d = cardOf(S.device) || {ip:addrOf(S.device), name:''};
  const chip = (id, label) => `<button class="chip ${S.filter === id ? 'on' : ''}" data-act="filter" data-f="${id}" aria-pressed="${S.filter === id}">${label}</button>`;
  return `
  <button class="btn link back" data-act="back">${ICON.back}All devices</button>
  <div class="pagehead">
    ${avatar(d, ' lg')}
    <div class="grow"><h1>${esc(deviceName(d))}</h1>
      <div class="meta addr">${addressWords(d, !!(d.hint && !suggested(d)))}</div>
      ${suggestionLines(d, false)}</div>
    <div class="actions"><button class="btn" data-act="rename">Rename</button></div>
  </div>
  <div class="row group-pick"><label for="groupSel">Group</label>
    <select id="groupSel"><option value="">None</option>${S.groups.map(g =>
      `<option value="${esc(g.id)}" ${d.group === g.id ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}</select>
    ${S.groups.length ? '' : '<button class="btn link" data-act="tab" data-tab="groups">Create a group</button>'}</div>
  ${d.last ? '' : `<div class="notice warn"><b>This device isn't using QuietNet yet</b>, so nothing can be seen or blocked for it.
    <button class="btn link" data-act="tab" data-tab="setup">Show me how to set it up</button></div>`}
  ${deviceWarning(d)}
  ${movedNotices(S.device)}
  ${otherDnsNotice(d)}
  ${sameAsNotice(d)}
  ${v6BypassNotice(d)}
  ${controls(scopeOf(S.device), 'this device')}
  ${enforceCard(d)}
  ${deviceDetails(d)}
  <h2 class="list-head">What it has been talking to</h2>
  <div class="controls">
    ${chip('all','Everything')}${chip('junk','Adverts &amp; suspicious')}${chip('blocked','Blocked')}
    <span class="spacer"></span>
    <select id="hours" aria-label="Time period">
      <option value="1">Last hour</option><option value="24">Last 24 hours</option><option value="168">Last 7 days</option></select>
    <select id="sort" aria-label="Sort by"><option value="n">Most contacted first</option><option value="last">Most recent first</option></select>
    <input type="search" id="search" placeholder="Search…" aria-label="Search" value="${esc(S.search)}">
  </div>
  <div class="card flush list" id="list">${activityList()}</div>
  <p class="meta">This list updates by itself every few seconds.
    <button class="btn link" data-act="clear">Forget this device's history</button></p>`;
}

/* ---------- Groups ---------- */
function viewGroups(){
  const tiles = S.groups.map(g => `
    <button class="tile" data-act="opengroup" data-id="${esc(g.id)}">
      <span class="avatar" aria-hidden="true">${esc(initials(g.name))}</span>
      <span class="tile-main"><span class="name">${esc(g.name)}</span>
        <span class="meta">${num(g.members.length)} device${g.members.length === 1 ? '' : 's'}</span></span>
      <span class="tile-figs">${num(g.services)} service${g.services === 1 ? '' : 's'} blocked</span>

}
// The household setting "New devices go into group": st.new_device_group is a group id or null.
function newDeviceCard(){
  const chosen = (S.status || {}).new_device_group;

function viewGroup(){
  const g = S.groups.find(x => x.id === S.group);
  if(!g) return viewGroups();
  // One row per device: those in the group can be taken out; the rest can be added (and named first).
  const row = (d, inGroup) => {
    const meta = `<span class="addr">${d.ip ? esc(d.ip) : 'Not on your network now'}</span>` + (inGroup
      ? (d.last ? ' · active ' + esc(ago(d.last)) : '')
      : (d.hint_detail ? ' · ' + esc(d.hint_detail) : '') + (d.group && d.group !== g.id ? ' · currently in ' + esc(groupName(d.group)) : ''));
    const buttons = inGroup
      ? `<button class="btn" data-act="member" data-device="${esc(keyOf(d))}" data-in="">Remove from group</button>`
      : (suggested(d) ? `<button class="btn soft" data-act="usehint" data-device="${esc(keyOf(d))}">Use this name</button>` : '')
        + (unknownDevice(d) ? `<button class="btn" data-act="rename" data-device="${esc(keyOf(d))}">Name it</button>` : '')
        + `<button class="btn" data-act="member" data-device="${esc(keyOf(d))}" data-in="1" aria-label="Add ${esc(deviceName(d))} to this group">Add</button>`;
    return `<li class="item${unknownDevice(d) ? ' unknown' : ''}"><div class="top">${avatar(d)}
      <div class="info"><span class="title${!inGroup && suggested(d) ? ' suggested-name' : ''}">${esc(deviceName(d))}</span>${!inGroup && suggested(d) ? '<span class="badge accent">Suggested name</span>' : ''}
        <div class="meta">${meta}</div></div>
      <div class="item-actions">${buttons}</div></div></li>`;
  };
  const inside = byName(S.devices.filter(d => d.group === g.id)), others = byName(S.devices.filter(d => d.group !== g.id));
  return `<button class="btn link back" data-act="groupback">${ICON.back}All groups</button>
    <div class="pagehead"><span class="avatar lg" aria-hidden="true">${esc(initials(g.name))}</span>
      <div class="grow"><h1>${esc(g.name)}</h1>
        <div class="meta">${num(g.members.length)} device${g.members.length === 1 ? '' : 's'} · ${num(g.services)} service${g.services === 1 ? '' : 's'} blocked</div></div>
      <div class="actions"><button class="btn" data-act="grouprename">Rename</button>
        <button class="btn danger-outline group-delete" data-act="groupdelete">Delete group</button></div></div>
    ${controls('group:' + g.id, 'this group')}
    <section class="card members" aria-labelledby="membersTitle">
      <h2 id="membersTitle">Devices in this group</h2>
      <p class="meta">Everything above applies to these devices.</p>
      <ul class="list">${inside.map(d => row(d, true)).join('') || '<li class="empty">No devices in this group yet.</li>'}</ul>
      <h3>Add a device to ${esc(g.name)}</h3>
      <ul class="list others">${others.map(d => row(d, false)).join('')
        || `<li class="empty">${S.devices.length ? 'Every device QuietNet knows is already in this group.' : 'No devices found yet.'}</li>`}</ul>
      <p class="meta">Not seeing a device? Use <button class="btn link" data-act="tab" data-tab="home">Find devices on my network</button> on the Devices page.</p>
    </section>`;
}

/* ---------- Schedules ---------- */
const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const DAYSETS = {'Every day':[0,1,2,3,4,5,6], 'Monday to Friday':[0,1,2,3,4], 'Weekends':[5,6], 'School nights (Sun to Thu)':[0,1,2,3,6]};
function daysText(days){
  const key = [...days].sort().join('');
  for(const [label, set] of Object.entries(DAYSETS)) if([...set].sort().join('') === key) return label;
  return [...days].sort().map(d => DAYS[d]).join(', ');
}
function scopeText(x){
  const scope = x.scope;
  if(scope === 'all') return 'Whole house';
  if(scope.startsWith('group:')) return groupName(+scope.slice(6)) + ' group';
  if(x.device != null){
    // The Pi says which device the schedule is for. A merged device can be at two addresses at
    // once, and its card is listed under only one of them: go by its number, not the address.
    const mine = S.devices.find(d => d.id === x.device);
    if(mine) return pickerLabel(mine);
  }
  if(scope.startsWith('dev:')){
    // A device named by its number. One QuietNet has since forgotten has no card to name it by.
    const known = S.devices.find(v => String(v.id) === scope.slice(4));
    return known ? pickerLabel(known) : 'A device QuietNet no longer lists';
  }
  // An older Pi names the device by its address alone.
  const d = S.devices.find(v => v.ip === scope.slice(7));
  return d ? pickerLabel(d) : scope.slice(7);
}
function whatText(x){
  return x.off ? 'All internet off'
    : 'Blocks ' + x.services.map(id => (S.services.find(v => v.id === id) || {}).name || id).join(', ');
}
function viewSchedules(){
  if(S.edit) return scheduleForm();
  const rows = S.schedules.map(x => `<div class="item"><div class="top">
    <label class="switch"><input type="checkbox" class="schedOn" data-id="${esc(x.id)}" ${x.enabled ? 'checked' : ''} aria-label="Use the ${esc(x.name)} schedule"><span></span></label>
    <span class="avatar sm moon" aria-hidden="true">${ICON.moon}</span>
    <div class="info"><h2 class="title">${esc(x.name)}</h2>${x.active ? '<span class="badge danger">On right now</span>' : ''}${x.enabled ? '' : '<span class="badge">Not in use</span>'}
      <div>${esc(scopeText(x))} · ${esc(daysText(x.days))}, <span class="mono">${esc(x.start)}</span> to <span class="mono">${esc(x.end)}</span>${x.start > x.end ? ' next morning' : ''}</div>
      <div class="meta">${esc(whatText(x))}</div></div>
    <div class="item-actions"><button class="btn" data-act="schededit" data-id="${esc(x.id)}">Change</button>
    <button class="btn link danger-text" data-act="scheddelete" data-id="${esc(x.id)}">Delete</button></div></div></div>`).join('');
  return `<div class="row section-head"><div class="grow"><h2>Schedules</h2>
    <p class="meta">Block things automatically at set times — bedtime, homework, school nights.
      Times go by this computer's clock (it's ${esc((S.status || {}).clock || '')} now).</p></div>
    <button class="btn primary" data-act="schednew" data-preset="bedtime">Add a bedtime</button>
    <button class="btn" data-act="schednew">New schedule</button></div>
    ${rows ? `<div class="card flush list schedules">${rows}</div>` : '<div class="card empty">No schedules yet. "Add a bedtime" is a good place to start.</div>'}`;
}
function scheduleForm(){
  const e = S.edit;
  const opt = (v, label) => `<option value="${esc(v)}" ${e.scope === v ? 'selected' : ''}>${esc(label)}</option>`;
  const cats = [...new Set(S.services.map(v => v.cat))];
  const grid = e.off ? '' : cats.map(cat => `<div class="cat">${esc(cat)}</div><div class="svcgrid">` +
    S.services.filter(v => v.cat === cat).map(v => {
      const on = e.services.includes(v.id);
      return `<button class="svc ${on ? 'on' : ''}" data-act="schedsvc" data-s="${esc(v.id)}" aria-pressed="${on}">${esc(v.name)}<small>${on ? 'Will be blocked' : 'Allowed'}</small></button>`;
    }).join('') + '</div>').join('');
  return `<button class="btn link back" data-act="schedcancel">${ICON.back}All schedules</button>
  <h1 class="page-title">${e.id ? 'Change schedule' : 'New schedule'}</h1>
  <div class="card">
    <label class="fld">Name<input type="text" id="sName" maxlength="40" placeholder="Bedtime" value="${esc(e.name)}"></label>
    <label class="fld">Who is it for?<select id="sScope">${opt('all', 'Whole house')}
      ${S.groups.length ? `<optgroup label="Groups">${S.groups.map(g => opt('group:' + g.id, g.name + ' group')).join('')}</optgroup>` : ''}
      ${S.devices.length ? `<optgroup label="Devices">${byName(S.devices).map(d => opt(scopeOf(keyOf(d)), pickerLabel(d))).join('')}</optgroup>` : ''}</select></label>
    <div class="fld">Which days?
      <div class="daychips">${DAYS.map((d, i) => `<button class="chip ${e.days.includes(i) ? 'on' : ''}" data-act="schedday" data-d="${i}" aria-pressed="${e.days.includes(i)}">${d}</button>`).join('')}</div>
      <div class="meta quick">Quick picks: ${Object.keys(DAYSETS).map(k => `<button class="btn link" data-act="scheddays" data-k="${esc(k)}">${esc(k)}</button>`).join('')}</div></div>
    <div class="row times">
      <label class="fld">Starts at<input type="time" id="sStart" value="${esc(e.start)}"></label>
      <label class="fld">Ends at<input type="time" id="sEnd" value="${esc(e.end)}"></label></div>
    <p class="meta hint" id="sHint">${overnightHint(e)}</p>
    <div class="fld">What should be blocked?
      <label class="check"><input type="radio" name="sWhat" value="off" ${e.off ? 'checked' : ''}> All internet</label>
      <label class="check"><input type="radio" name="sWhat" value="svc" ${e.off ? '' : 'checked'}> Only the apps and services I choose</label></div>
    ${grid}
    <div class="row form-actions">
      <button class="btn" data-act="schedcancel">Cancel</button>
      <button class="btn primary" data-act="schedsave">Save schedule</button></div>
  </div>`;
}
function overnightHint(e){
  return e.start && e.end && e.start > e.end ? `This runs overnight: from ${esc(e.start)} until ${esc(e.end)} the next morning.` : '';
}

/* ---------- Blocked list ---------- */
function viewRules(){
  const r = S.rules || {blocked:[], allowed:[]}, c = (S.status || {}).community || {};
  // `blocks` is true for the "Blocked by you" list: only there does a needed name carry its note.
  const rows = (list, label, blocks) => list.length ? `<div class="list rows">${list.map(x => `
    <div class="item"><div class="top"><div class="info"><span class="title mono">${esc(x.d)}</span>${blocks && x.needed ? `<span class="badge warn">Needed by ${esc(x.needed)}</span>` : ''}
      <div class="meta">${x.owner ? esc(x.owner) + ' · ' : ''}added ${esc(ago(x.ts))}</div>${blocks ? neededBlockedNote(x.needed) : ''}</div>
      <button class="btn" data-act="forget" data-d="${esc(x.d)}">${label}</button></div></div>`).join('')}</div>`
    : '<div class="empty">Nothing here yet.</div>';
  let listInfo = c.installed
    ? `Installed: ${num(c.count)} junk addresses, last updated ${esc(ago(c.updated))}.`
    : 'Not downloaded yet. QuietNet is using its small built-in list.';
  if(c.state === 'downloading') listInfo = 'Downloading… this takes a few seconds.';
  if(c.state === 'error') listInfo = 'The download didn\'t work — check the internet connection and try again. (' + esc(c.error) + ')';
  return `
  ${controls('all', 'the whole house')}
  <div class="card"><h2>Block an address yourself</h2>
    <p class="meta">Type a website or address, for example <i>ads.example.com</i>. Everything under it is blocked too.</p>
    <div class="row"><input type="text" id="addBox" class="grow" placeholder="example.com" aria-label="Address to block">
      <button class="btn primary" data-act="add">Block</button></div></div>
  <div class="card"><h2>Blocked by you</h2>${rows(r.blocked, 'Unblock', true)}</div>
  <div class="card"><h2>Always allowed</h2>
    <p class="meta">Addresses you unblocked even though they're on the junk list.</p>${rows(r.allowed, 'Remove', false)}</div>
  <div class="card"><h2>The full junk list</h2>
    <p class="meta">A free list of well over 100,000 known advert and tracker addresses, kept up to date by volunteers
      (the StevenBlack list). Downloading it makes automatic blocking far more thorough.</p>
    <p class="small">${listInfo}</p>
    <button class="btn ${c.installed ? '' : 'primary'}" data-act="getlist" ${c.state === 'downloading' ? 'disabled' : ''}>
      ${c.installed ? 'Update the list' : 'Download the full list'}</button></div>`;
}

/* ---------- Set up a device ---------- */
function cloudCard(){
  const c = S.cloud || {};
  if(!c.configured && !c.paired && c.state === undefined) return '';
  if(c.paired){
    const label = {online:'Connected', connecting:'Connecting…', off:'Off',
                   error:'Problem — ' + (c.detail || 'trying again')}[c.state] || c.state;
    return `<div class="card"><h2>Remote access${c.state === 'online' ? '<span class="badge accent">On</span>' : ''}</h2>
      <p>This QuietNet is linked to your online account. Status: <b>${esc(label)}</b>.</p>
      <p class="meta">Open your relay website and sign in to control this from anywhere — no router changes needed.</p>
      <button class="btn danger-outline" data-act="cloudforget">Unlink</button></div>`;
  }
  return `<div class="card"><h2>Remote access <span class="muted opt">(optional)</span></h2>
    <p class="meta">Control this QuietNet from outside your home. On your relay website, sign in and choose
      <b>Add a QuietNet</b>, then type the web address and pairing code it shows you here.</p>
    <label class="fld">Relay web address<input type="text" id="clRelay" placeholder="your-relay.up.railway.app" value="${esc(c.relay || '')}"></label>
    <label class="fld">Pairing code<input type="text" id="clCode" placeholder="ABCD-1234"></label>
    <button class="btn primary" data-act="cloudpair">Link this QuietNet</button></div>`;
}
// The Appearance chooser: last on this page, and reached from the Appearance button in the header.
