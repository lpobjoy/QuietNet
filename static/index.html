<!doctype html>
<html lang="en" data-theme="calm">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuietNet</title>
<script>
/* Theme: set before the page is drawn, so it never flashes the wrong colours. Only the three known
   names are accepted; anything else in the cookie means the calm theme. */
(function(){
  var m = /(?:^|;\s*)qn_theme=(calm|household|control)(?:;|$)/.exec(document.cookie || '');
  document.documentElement.setAttribute('data-theme', m ? m[1] : 'calm');
})();
</script>
<style>
/* ===== Looks (themes) =====
   Three looks share one set of class names. Each look sets the colour, size and spacing values
   below (custom properties) on the page's root element through its data-theme attribute, and lays
   the same markup out its own way further down. Calm is the default and is also used when the
   attribute is missing. Fonts come from the device only: nothing is downloaded. */
:root, [data-theme="calm"]{
  color-scheme:light dark;
  --font-body:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-head:var(--font-body);
  --font-mono:ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --bg:#f4f3ef; --surface:#ffffff; --surface-2:#f4f3ef; --surface-3:#f4f3ef; --chip-bg:#efede7; --field-bg:#ffffff;
  --ink:#1d1c1a; --ink-2:#3d3a35; --body-2:#3d3a35; --muted:#5e5a53;
  --line:#e0ddd5; --line-2:#e0ddd5; --line-strong:#e0ddd5; --field-line:#8a857b; --dashed:#a29d93;
  --accent:#0e6b62; --accent-hover:#0a4f48; --on-accent:#ffffff;
  --accent-soft:#e1eeeb; --accent-soft-ink:#0a524b; --accent-line:#b9d6d1;
  --ok:#0e6b62; --ok-ink:#0a524b; --ok-soft:#e1eeeb; --ok-line:#b9d6d1;
  --warn:#7a4a07; --warn-dot:#b7791f; --warn-soft:#fbf1dc;
  --danger:#a33222; --danger-hover:#862819; --on-danger:#ffffff;
  --danger-soft:#fbf3f1; --danger-soft-ink:#a33222; --danger-line:#e9cfc8;
  --knob:#ffffff; --knob-on:#ffffff; --focus:#0e6b62; --focus-halo:#cfe5e1; --focus-w:2px;
  --code-bg:#f4f3ef; --code-ink:#1d1c1a; --code-line:#e0ddd5; --code-hi:#1d1c1a;
  --bar-bg:#23221f; --bar-ink:#f4f3ef; --bar-muted:#c9c5bc; --bar-line:#4a4842; --bar-dot:#5fc4b6;
  --overlay:rgba(29,28,26,.45); --shadow-card:none; --shadow-raise:0 8px 24px rgba(29,28,26,.12);
  --row-hover:#f4f3ef; --tile-hover-line:#e0ddd5;
  --r-sm:4px; --r-md:8px; --r-lg:12px; --r-btn:8px; --r-pill:999px;
  --fs-body:15px; --fs-small:13px; --fs-xs:12.5px; --fs-h1:24px; --fs-h2:15px; --fs-h3:13px;
  --head-weight:600; --head-track:-0.02em;
  --gap:12px; --pad-card:20px; --pad-row:8px 8px 8px 12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="household"]):not([data-theme="control"]){
    --bg:#161513; --surface:#1f1e1b; --surface-2:#2a2925; --surface-3:#2a2925; --chip-bg:#2a2925; --field-bg:#161513;
    --ink:#ecebe6; --ink-2:#d2cfc7; --body-2:#d2cfc7; --muted:#a9a49a;
    --line:#3a3832; --line-2:#3a3832; --line-strong:#48453e; --field-line:#7a756b; --dashed:#7a756b;
    --accent:#5fc4b6; --accent-hover:#7dd3c7; --on-accent:#0b2522;
    --accent-soft:#1d3633; --accent-soft-ink:#9fded4; --accent-line:#2f5a54;
    --ok:#5fc4b6; --ok-ink:#9fded4; --ok-soft:#1d3633; --ok-line:#2f5a54;
    --warn:#e6b25a; --warn-dot:#e6b25a; --warn-soft:#3a2d12;
    --danger:#f0907f; --danger-hover:#f5a698; --on-danger:#1a0d0a;
    --danger-soft:#3a1f1b; --danger-soft-ink:#f0907f; --danger-line:#5c2e27;
    --knob:#ecebe6; --knob-on:#0b2522; --focus:#5fc4b6; --focus-halo:#234541;
    --code-bg:#161513; --code-ink:#ecebe6; --code-line:#3a3832; --code-hi:#ecebe6;
    --bar-bg:#0f0e0d; --bar-ink:#f4f3ef; --bar-muted:#c9c5bc; --bar-line:#3a3832; --bar-dot:#5fc4b6;
    --overlay:rgba(0,0,0,.6); --shadow-card:none; --shadow-raise:0 8px 24px rgba(0,0,0,.5);
    --row-hover:#2a2925; --tile-hover-line:#48453e;
  }
}
[data-theme="household"]{
  color-scheme:light dark;
  --font-head:ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --bg:#FAF7F2; --surface:#FFFFFF; --surface-2:#FBF8F4; --surface-3:#FBF8F4; --chip-bg:#F3EDE7; --field-bg:#FFFFFF;
  --ink:#2A2125; --ink-2:#2A2125; --body-2:#2A2125; --muted:#5E5156;
  --line:#E8E0D8; --line-2:#EFE8E1; --line-strong:#E0D6CD; --field-line:#94878D; --dashed:#CFC4BB;
  --accent:#6B2E5F; --accent-hover:#4A1F42; --on-accent:#FFFFFF;
  --accent-soft:#F3E8F0; --accent-soft-ink:#4A1F42; --accent-line:#D9B8D1;
  --ok:#0F766E; --ok-ink:#0F766E; --ok-soft:#E1F2EF; --ok-line:#BFE6DF;
  --warn:#7A4B2A; --warn-dot:#B7791F; --warn-soft:#F4ECE4;
  --danger:#A3302A; --danger-hover:#FBEDEC; --on-danger:#FFFFFF;
  --danger-soft:#FBEDEC; --danger-soft-ink:#A3302A; --danger-line:#E6C9C6;
  --knob:#FFFFFF; --knob-on:#FFFFFF; --focus:#6B2E5F; --focus-halo:#D9B8D1; --focus-w:3px;
  --code-bg:#2A2125; --code-ink:#F6EFE9; --code-line:#2A2125; --code-hi:#F6EFE9;
  --bar-bg:#2A2125; --bar-ink:#F6EFE9; --bar-muted:#BFE6DF; --bar-line:#4A3D43; --bar-dot:#5EC4B6;
  --overlay:rgba(42,33,37,.45); --shadow-card:0 1px 2px rgba(42,33,37,.04);
  --shadow-raise:0 1px 2px rgba(42,33,37,.04), 0 8px 24px rgba(42,33,37,.06);
  --row-hover:#FBF8F4; --tile-hover-line:#C9B3C2;
  --r-sm:6px; --r-md:12px; --r-lg:20px; --r-btn:999px; --r-pill:999px;
  --fs-body:16px; --fs-small:14px; --fs-xs:13px; --fs-h1:30px; --fs-h2:17px; --fs-h3:15px;
  --head-weight:600; --head-track:-0.02em;
  --gap:16px; --pad-card:20px 24px; --pad-row:14px 16px;
}
@media (prefers-color-scheme: dark){
  [data-theme="household"]{
    --bg:#1C1619; --surface:#261E22; --surface-2:#2F262A; --surface-3:#2F262A; --chip-bg:#33282E; --field-bg:#1C1619;
    --ink:#F6EFE9; --ink-2:#F6EFE9; --body-2:#F6EFE9; --muted:#C2B4BA;
    --line:#3D3237; --line-2:#362C31; --line-strong:#4A3D43; --field-line:#857479; --dashed:#5E5156;
    --accent:#E3B5D8; --accent-hover:#EDC8E3; --on-accent:#2A1025;
    --accent-soft:#3E2639; --accent-soft-ink:#F0D3E8; --accent-line:#5A3A52;
    --ok:#5EC4B6; --ok-ink:#8FD9CE; --ok-soft:#1E3532; --ok-line:#2F5A54;
    --warn:#E8B48C; --warn-dot:#E8B48C; --warn-soft:#3A2A1E;
    --danger:#F2948C; --danger-hover:#3A1F1E; --on-danger:#2A0F0D;
    --danger-soft:#3A1F1E; --danger-soft-ink:#F2948C; --danger-line:#5C3431;
    --knob:#F6EFE9; --knob-on:#1C1619; --focus:#E3B5D8; --focus-halo:#5A3A52;
    --code-bg:#120E10; --code-ink:#F6EFE9; --code-line:#3D3237; --code-hi:#F6EFE9;
    --bar-bg:#120E10; --bar-ink:#F6EFE9; --bar-muted:#BFE6DF; --bar-line:#3D3237; --bar-dot:#5EC4B6;
    --overlay:rgba(0,0,0,.6); --shadow-card:none; --shadow-raise:0 8px 24px rgba(0,0,0,.5);
    --row-hover:#2F262A; --tile-hover-line:#4A3D43;
  }
}
[data-theme="control"]{
  color-scheme:dark;
  --font-head:var(--font-body);
  --bg:#0E1116; --surface:#151A21; --surface-2:#11151B; --surface-3:#0F1318; --chip-bg:#1B222B; --field-bg:#0B0E12;
  --ink:#E6EAF0; --ink-2:#C9D2DC; --body-2:#B4BFCC; --muted:#9AA6B5;
  --line:#2A333F; --line-2:#222A35; --line-strong:#2F3946; --field-line:#5C6878; --dashed:#3A4553;
  --accent:#F5B83D; --accent-hover:#FFC95C; --on-accent:#14110A;
  --accent-soft:#2A2210; --accent-soft-ink:#F5B83D; --accent-line:#5C4A1E;
  --ok:#4ADE80; --ok-ink:#7EE2A8; --ok-soft:#10241A; --ok-line:#24503A;
  --warn:#F5B83D; --warn-dot:#F5B83D; --warn-soft:#2A2210;
  --danger:#FF8A80; --danger-hover:#FF6B5E; --on-danger:#14110A;
  --danger-soft:#1E1415; --danger-soft-ink:#FFB4AC; --danger-line:#5A2E2A;
  --knob:#6B7685; --knob-on:#14110A; --focus:#F5B83D; --focus-halo:transparent; --focus-w:2px;
  --code-bg:#0B0E12; --code-ink:#E6EAF0; --code-line:#2A333F; --code-hi:#F5B83D;
  --bar-bg:#0A0C10; --bar-ink:#C9D2DC; --bar-muted:#9AA6B5; --bar-line:#1C232D; --bar-dot:#4ADE80;
  --overlay:rgba(0,0,0,.65); --shadow-card:none; --shadow-raise:0 12px 32px rgba(0,0,0,.6);
  --row-hover:#1B222B; --tile-hover-line:#3A4553;
  --r-sm:4px; --r-md:6px; --r-lg:10px; --r-btn:6px; --r-pill:999px;
  --fs-body:15px; --fs-small:13px; --fs-xs:11px; --fs-h1:24px; --fs-h2:15px; --fs-h3:14px;
  --head-weight:600; --head-track:-0.01em;
  --gap:16px; --pad-card:16px; --pad-row:10px 16px;
  --band-pad:max(16px, calc((100vw - 76rem) / 2));
}

/* ===== Shared parts (every look) ===== */
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:var(--fs-body);line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
h1{font-family:var(--font-head);font-size:var(--fs-h1);font-weight:var(--head-weight);letter-spacing:var(--head-track);line-height:1.2;margin:0 0 4px;overflow-wrap:anywhere}
h2{font-size:var(--fs-h2);font-weight:var(--head-weight);letter-spacing:-.01em;line-height:1.35;margin:0 0 4px}
h3{font-size:var(--fs-h3);font-weight:600;color:var(--ink-2);margin:20px 0 8px}
p{margin:0 0 10px}
a{color:var(--accent)}
.muted{color:var(--muted)} .small{font-size:var(--fs-small)}
.meta{font-size:var(--fs-small);color:var(--muted);margin:0}
.mono{font-variant-numeric:tabular-nums}
.ico{width:18px;height:18px;flex:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
[hidden]{display:none!important}
:focus-visible{outline:var(--focus-w) solid var(--focus);outline-offset:2px}
/* Rows inside a clipped list (Calm, Control room) draw the ring inside themselves, or the list would cut it off. */
[data-theme="calm"] .tiles .tile:focus-visible,[data-theme="control"] .tiles .tile:focus-visible{outline-offset:calc(-1 * var(--focus-w) - 2px)}
.spacer{flex:1}
.grow{flex:1 1 220px;min-width:0}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.err-text{color:var(--danger)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 14px;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink-2);border-radius:var(--r-btn);font-size:14px;font-weight:500;line-height:1.25;cursor:pointer;
  white-space:nowrap;text-decoration:none;vertical-align:middle}
.btn:hover{border-color:var(--field-line)}
.btn:disabled{opacity:.65;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--on-danger);font-weight:600}
.btn.danger:hover{filter:brightness(.93)}
.btn.danger-outline{background:var(--surface);border-color:var(--danger);color:var(--danger)}
.btn.danger-outline:hover{background:var(--danger-soft)}
.btn.soft{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-soft-ink);font-weight:600}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--chip-bg)}
.btn.link{border:0;background:none;color:var(--accent);padding:0 4px;text-decoration:underline;text-underline-offset:2px;font-weight:500;font-size:inherit}
.btn.link:hover{color:var(--accent-hover)}
.btn.link.danger-text{color:var(--danger)}
.btn.back{text-decoration:none;color:var(--muted);padding:0;gap:4px;font-size:var(--fs-small);margin:0 0 4px}
.btn.back:hover{color:var(--ink)}
.btn .ico{width:18px;height:18px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--pad-card);box-shadow:var(--shadow-card);margin:0 0 var(--gap)}
.card.flush{padding:0;overflow:hidden}
.part{padding:16px 0;border-top:1px solid var(--line-2)}
.part:first-child{border-top:0;padding-top:0}
.part:last-child{padding-bottom:0}
.part.net{display:flex;align-items:center;gap:12px}
.section-head{margin:8px 0 12px}
.list-head{margin:24px 0 0}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:var(--r-pill);font-size:12px;font-weight:500;
  background:var(--accent-soft);color:var(--accent-soft-ink);white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--danger-soft);color:var(--danger-soft-ink)}
.badge{display:inline-block;font-size:var(--fs-xs);font-weight:600;line-height:1.5;padding:1px 8px;border-radius:var(--r-pill);background:var(--chip-bg);
  color:var(--muted);margin-left:6px;vertical-align:1px;white-space:nowrap}
.badge.accent{background:var(--accent-soft);color:var(--accent-soft-ink)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.danger{background:var(--danger-soft);color:var(--danger-soft-ink)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none;background:var(--muted)}
.dot.on{background:var(--ok)} .dot.wait{background:none;border:2px solid var(--warn-dot)}

.notice{border-radius:var(--r-md);padding:12px 16px;margin:0 0 var(--gap)}
.notice.flex{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.notice.danger{background:var(--danger-soft);color:var(--danger-soft-ink);border:1px solid var(--danger-line)}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice.info{background:var(--accent-soft);color:var(--accent-soft-ink)}
.notice .btn.link{color:inherit}

/* The on/off switch: a real checkbox drawn as a track and a knob. The box is 44px tall so it is easy
   to hit; the track drawn inside it is 32px. */
.switch{position:relative;width:52px;height:44px;flex:none}
.switch input{opacity:0;width:100%;height:100%;margin:0;cursor:pointer;position:absolute;z-index:1}
.switch span{position:absolute;top:6px;right:0;bottom:6px;left:0;background:var(--field-line);border-radius:999px;transition:.15s}
.switch span::after{content:"";position:absolute;width:24px;height:24px;left:4px;top:4px;background:var(--knob);border-radius:50%;transition:.15s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{left:24px;background:var(--knob-on)}
.switch input:focus-visible+span{outline:var(--focus-w) solid var(--focus);outline-offset:2px}

input[type=search],input[type=text],input[type=time],select{min-height:44px;border:1px solid var(--field-line);background:var(--field-bg);color:var(--ink);
  border-radius:var(--r-md);padding:8px 12px;min-width:0;max-width:100%}
input[type=search]:focus,input[type=text]:focus,input[type=time]:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--focus-halo)}
::placeholder{color:var(--muted);opacity:1}
.fld{display:block;margin:0 0 16px;font-size:var(--fs-small);font-weight:500;color:var(--ink-2)}
.fld input[type=text],.fld select{display:block;width:100%;max-width:420px;margin-top:6px;font-size:var(--fs-body);font-weight:400}
.fld input[type=time]{display:block;margin-top:6px;font-size:var(--fs-body);font-weight:400}
label.check{display:flex;gap:10px;align-items:center;min-height:44px;padding:4px 0;border-top:1px solid var(--line-2);cursor:pointer;
  font-size:var(--fs-body);font-weight:400;color:var(--ink)}
label.check:first-of-type{border-top:0}
label.check input{width:20px;height:20px;flex:none;margin:0;accent-color:var(--accent)}

.chip{min-height:44px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);border-radius:var(--r-pill);padding:0 14px;
  font-size:var(--fs-small);font-weight:500;cursor:pointer}
.chip:hover{border-color:var(--field-line)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.daychips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}

.chips{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 2px 0 10px;border:1px solid var(--danger-line);background:var(--danger-soft);
  color:var(--ink);border-radius:var(--r-md);font-size:var(--fs-small);font-weight:500}
.tag.static{padding-right:10px}
.tag>.ico{width:14px;height:14px;color:var(--danger)}
.tag-from{color:var(--muted);font-weight:400}
.tag-x{position:relative;display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;padding:0;border:0;background:none;
  color:inherit;border-radius:var(--r-sm);cursor:pointer}
.tag-x::before{content:"";position:absolute;top:-6px;right:-6px;bottom:-6px;left:-6px}
.tag-x:hover{background:var(--danger-line)}
.tag-x .ico{width:14px;height:14px}

.svcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:8px;margin:6px 0 12px}
.svc{display:flex;flex-direction:column;align-items:flex-start;min-height:44px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
  border-radius:var(--r-md);padding:8px 12px;cursor:pointer;text-align:left;font-weight:600;font-size:var(--fs-small)}
.svc small{font-weight:500;color:var(--muted);font-size:var(--fs-xs)}
.svc:hover{border-color:var(--field-line)}
.svc.on{background:var(--danger-soft);border-color:var(--danger-line);color:var(--danger-soft-ink)}
.svc.on small{color:var(--danger-soft-ink)}
.svc:disabled{cursor:default}
.cat{font-size:var(--fs-xs);font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px}

.sched{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--surface-2);border-radius:var(--r-md);padding:10px 12px;margin:8px 0}
.sched b{font-weight:600}

.list{list-style:none;margin:0;padding:0}
.item{padding:var(--pad-row);border-top:1px solid var(--line-2)}
.item:first-child{border-top:0}
.item .top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.item .info{flex:1 1 200px;min-width:0}
.item .title{font-weight:600;overflow-wrap:anywhere;font-size:var(--fs-body);margin:0;display:inline}
.item-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hosts{margin:8px 0 0 14px;padding-left:12px;border-left:2px solid var(--line)}
.hosts .item{padding:8px 0}
.hosts .title{font-weight:500;font-family:var(--font-mono);font-size:13px}
.expand{display:inline-flex;align-items:center;min-height:44px;background:none;border:0;color:var(--accent);font-size:var(--fs-small);font-weight:600;padding:0;cursor:pointer}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}

.avatar{display:inline-flex;align-items:center;justify-content:center;flex:none;width:36px;height:36px;border-radius:8px;
  background:var(--accent-soft);color:var(--accent-soft-ink);font-size:13px;font-weight:600;line-height:1}
.avatar.unknown{background:none;border:1px dashed var(--dashed);color:var(--muted)}
.avatar.sm{width:32px;height:32px}
.avatar.moon{background:var(--warn-soft);color:var(--warn)}
.avatar.lg{display:none}
.avatar .ico{width:18px;height:18px}

.pagehead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin:4px 0 16px}
.pagehead .actions{display:flex;flex-wrap:wrap;gap:8px}
.sugg{display:block}
.sugg .btn{margin-left:8px}
.group-pick{margin:0 0 16px}
.group-pick select{min-width:180px}

.tile{font:inherit;color:inherit;cursor:pointer;text-align:left;width:100%;margin:0}
.tile .name{font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.tile-main{min-width:0;display:flex;flex-direction:column}
.tile-main .meta{display:block}
.tile-figs{font-size:var(--fs-small);color:var(--muted)}
.tile-figs b{color:var(--ink);font-weight:600}
.tile-badges .badge{margin:4px 6px 0 0}
.tile-badges:empty{display:none}
.tile .go{color:var(--accent);width:16px;height:16px}
.thead{display:none}

.home-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.stat{background:var(--surface-2);border-radius:var(--r-md);padding:12px}
.stat b{display:block;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.stat span{font-size:var(--fs-small);color:var(--muted)}

.bigcode{display:inline-block;font-family:var(--font-mono);font-size:24px;font-weight:600;letter-spacing:.04em;font-variant-numeric:tabular-nums;
  background:var(--surface-2);color:var(--ink);padding:10px 16px;border-radius:var(--r-md);margin:6px 0 12px;user-select:all;overflow-wrap:anywhere}
details{border-top:1px solid var(--line-2)}
details:first-of-type{border-top:0}
summary{min-height:44px;display:flex;align-items:center;justify-content:space-between;font-weight:600;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"";flex:none;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);
  transform:rotate(45deg);margin:0 6px 4px 12px;transition:transform .15s}
details[open] summary::after{transform:rotate(225deg);margin-bottom:-4px}
details ol{margin:0 0 12px;padding-left:22px}
details li{margin:4px 0}
.opt{font-weight:400}

.page-title{margin:4px 0 16px}
.quick{font-weight:400}
.times{align-items:flex-start}
.hint{margin-top:-8px}
.form-actions{justify-content:flex-end;margin-top:8px}

/* The Appearance chooser: real radio buttons, each inside a large label. The swatches are fixed
   colours, so each one shows its own look whatever look is in use. */
.themes{border:0;margin:0;padding:0;display:grid;gap:8px;min-width:0}
.theme-opt{display:flex;gap:12px;align-items:center;min-height:56px;padding:10px 14px;border:1px solid var(--line-strong);border-radius:var(--r-md);
  cursor:pointer;background:var(--surface)}
.theme-opt:hover{border-color:var(--field-line)}
.theme-opt input{accent-color:var(--accent);width:20px;height:20px;flex:none;margin:0}
.theme-opt input:checked ~ .theme-text b{color:var(--accent)}
.theme-text{display:flex;flex-direction:column;min-width:0}
.theme-text b{font-weight:600}
.swatch{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:none}
.swatch i{display:block;width:14px;height:28px}
.swatch-calm i:nth-child(1){background:#f4f3ef} .swatch-calm i:nth-child(2){background:#0e6b62} .swatch-calm i:nth-child(3){background:#1d1c1a}
.swatch-household i:nth-child(1){background:#FAF7F2} .swatch-household i:nth-child(2){background:#6B2E5F} .swatch-household i:nth-child(3){background:#0F766E}
.swatch-control i:nth-child(1){background:#0E1116} .swatch-control i:nth-child(2){background:#F5B83D} .swatch-control i:nth-child(3){background:#E6EAF0}

.modal{position:fixed;top:0;right:0;bottom:0;left:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
.modal .card{max-width:440px;width:100%;margin:0;padding:24px;box-shadow:var(--shadow-raise)}
.modal input{width:100%;margin:8px 0 4px}
.modal .row{justify-content:flex-end;margin-top:16px}
/* The longer questions (Merge, Separate) list what would apply before anything is changed; the box
   scrolls when the list is taller than the screen. */
.modal .card.wide{max-width:560px;max-height:calc(100vh - 32px);overflow-y:auto}
.modal .card.wide h3{margin:16px 0 4px;overflow-wrap:anywhere}
.modal .card.wide .meta{margin:0 0 6px}
.plan{margin:0 0 8px;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
.modal .list.plan .item{min-height:0;padding:6px 0;font-size:var(--fs-small);overflow-wrap:anywhere}
.details h3{margin:16px 0 4px}
.details .list{border-top:1px solid var(--line-2)}
.details .item{padding:8px 0}
.details .group-pick{margin:16px 0 8px}

/* The page frame: header, section tabs, the whole-house controls, the day's figures and the view.
   Each look places these with grid areas of the same names. */
.shell>.top{grid-area:top;display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px}
.logo{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.logo-mark{width:22px;height:22px;color:var(--accent)}
.tabs{grid-area:tabs;display:flex}
.tab{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border:0;background:none;color:var(--ink-2);font-size:14px;font-weight:500;
  cursor:pointer;white-space:nowrap;border-radius:var(--r-md)}
.strip{grid-area:strip;display:none}
.fig-label,.fig-num{display:block}
.house{grid-area:house}
.house-title{display:flex;align-items:center;gap:8px;margin:0 0 4px}
.house-note{margin:0 0 10px;font-size:var(--fs-small);color:var(--muted)}
.content{grid-area:content;min-width:0}

/* ===== Calm: sections down the side, one quiet surface for the view ===== */
[data-theme="calm"] .shell{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:248px minmax(0,1fr);
  grid-template-rows:auto auto auto 1fr;grid-template-areas:"top content" "tabs content" "house content" ". content";align-items:start}
[data-theme="calm"] .shell>.top{padding:20px 16px 8px}
[data-theme="calm"] .shell>.top .spacer{display:none}
[data-theme="calm"] .appearance-link{flex-basis:100%;justify-content:flex-start;margin-left:-10px;padding:0 10px;font-size:13px}
[data-theme="calm"] .tabs{flex-direction:column;gap:2px;padding:0 16px 16px}
[data-theme="calm"] .tab{width:100%;text-align:left}
[data-theme="calm"] .tab:hover{background:var(--chip-bg)}
[data-theme="calm"] .tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent-soft-ink);font-weight:600}
[data-theme="calm"] .house{margin:0 16px;border-top:1px solid var(--line);padding-top:16px;display:grid;gap:14px}
[data-theme="calm"] .pause-box .house-title,[data-theme="calm"] .pause-box .house-note{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
[data-theme="calm"] .pause-box .btn{width:100%;justify-content:flex-start;font-size:13px;white-space:normal;text-align:left;padding:8px 10px}
[data-theme="calm"] .kill-box{border:1px solid var(--danger-line);background:var(--danger-soft);border-radius:10px;padding:12px}
[data-theme="calm"] .kill-box .house-title{font-size:13px;color:var(--danger)}
[data-theme="calm"] .kill-box .house-title .ico{width:16px;height:16px}
[data-theme="calm"] .kill-box .house-note{font-size:12.5px;margin:0 0 10px}
[data-theme="calm"] .kill-box .house-note.small{margin:8px 0 0}
[data-theme="calm"] .kill-box .btn{width:100%;font-size:13px}
[data-theme="calm"] .content{padding:20px 16px 56px}
[data-theme="calm"] #view{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
[data-theme="calm"] #view .card{background:none;border:0;border-top:1px solid var(--line-2);border-radius:0;padding:16px 0;margin:0;box-shadow:none}
[data-theme="calm"] #view .card:first-child{border-top:0;padding-top:0}
[data-theme="calm"] #view .card.list,[data-theme="calm"] .members .list,[data-theme="calm"] .rows{border:1px solid var(--line);border-radius:8px;padding:0;margin:0 0 12px;overflow:hidden}
[data-theme="calm"] .tiles{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:0 0 12px}
[data-theme="calm"] .tile{display:grid;grid-template-columns:36px minmax(0,1fr) auto 16px;gap:4px 14px;align-items:center;min-height:64px;padding:12px 16px;
  border:0;border-top:1px solid var(--line-2);background:none}
[data-theme="calm"] .tile:first-child{border-top:0}
[data-theme="calm"] .tile:hover{background:var(--surface-2)}
[data-theme="calm"] .tile .avatar{grid-column:1;grid-row:1 / span 2}
[data-theme="calm"] .tile-main{grid-column:2;grid-row:1}
[data-theme="calm"] .tile-figs{grid-column:3;grid-row:1;text-align:right}
[data-theme="calm"] .tile-badges{grid-column:2 / span 2;grid-row:2}
[data-theme="calm"] .tile .go{grid-column:4;grid-row:1 / span 2}
[data-theme="calm"] .chip{border-radius:8px;font-size:13px}
[data-theme="calm"] .group-delete{background:none;border-color:transparent;text-decoration:underline;text-underline-offset:2px;padding:0 4px}
[data-theme="calm"] .members .avatar{width:32px;height:32px}
[data-theme="calm"] .members .others .avatar{background:var(--chip-bg);color:var(--ink-2)}
[data-theme="calm"] .members .others .avatar.unknown{background:none;color:var(--muted)}
[data-theme="calm"] .members .item{padding:8px 12px}
@media (max-width:760px){
  [data-theme="calm"] .shell{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-template-areas:"top" "tabs" "house" "content"}
  [data-theme="calm"] .tabs{flex-direction:row;flex-wrap:wrap;gap:4px}
  [data-theme="calm"] .tab{flex:1 1 auto;width:auto}
  [data-theme="calm"] .house{grid-template-columns:minmax(0,1fr)}
  [data-theme="calm"] .kill-box .house-note:not(.small){display:none}
  [data-theme="calm"] .content{padding:16px 16px 48px}
  [data-theme="calm"] #view{padding:16px}
  [data-theme="calm"] .tile{grid-template-columns:36px minmax(0,1fr) 16px}
  [data-theme="calm"] .tile-figs{grid-column:2;grid-row:2;text-align:left}
  [data-theme="calm"] .tile-badges{grid-column:2;grid-row:3}
  [data-theme="calm"] .tile .avatar{grid-row:1 / span 3}
  [data-theme="calm"] .tile .go{grid-column:3;grid-row:1 / span 3}
}

/* ===== Household: a white band on top, people-first cards, the house controls on the right ===== */
[data-theme="household"] .shell{display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-areas:"top top" "tabs tabs" "content house";
  column-gap:24px;max-width:1120px;margin:0 auto;padding:0 16px;align-items:start}
[data-theme="household"] .shell>.top{background:var(--surface);box-shadow:0 0 0 100vmax var(--surface);-webkit-clip-path:inset(0 -100vmax);clip-path:inset(0 -100vmax);padding:16px 0 8px}
[data-theme="household"] .logo{font-family:var(--font-head);font-size:19px}
[data-theme="household"] .logo-mark{width:26px;height:26px}
[data-theme="household"] .pill{background:var(--ok-soft);color:var(--ok-ink);font-size:13px;font-weight:600}
[data-theme="household"] .pill.warn{background:var(--warn-soft);color:var(--warn)}
[data-theme="household"] .pill.bad{background:var(--danger-soft);color:var(--danger-soft-ink)}
[data-theme="household"] .tabs{background:var(--surface);box-shadow:0 0 0 100vmax var(--surface), 0 1px 0 100vmax var(--line);
  -webkit-clip-path:inset(0 -100vmax -1px);clip-path:inset(0 -100vmax -1px);flex-wrap:wrap;gap:4px;padding:8px 0 12px}
[data-theme="household"] .tab{padding:0 16px;border-radius:999px;color:var(--muted);font-size:15px}
[data-theme="household"] .tab:hover{background:var(--chip-bg)}
[data-theme="household"] .tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent-soft-ink);font-weight:600}
[data-theme="household"] .tab .ico{display:none}
[data-theme="household"] .switch input:checked+span{background:var(--ok)}
[data-theme="household"] .content{padding:24px 0 56px}
[data-theme="household"] .house{display:grid;gap:16px;align-content:start;padding-top:24px}
[data-theme="household"] .pause-box,[data-theme="household"] .kill-box{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow-card)}
[data-theme="household"] .house-title{font-family:var(--font-head);font-size:18px;gap:12px;margin-bottom:8px}
[data-theme="household"] .kill-box .house-title .ico{width:40px;height:40px;padding:11px;border-radius:50%;background:var(--danger-soft);color:var(--danger)}
[data-theme="household"] .house .btn{width:100%;justify-content:center;min-height:48px;border-radius:12px;white-space:normal;text-align:center;font-size:15px}
[data-theme="household"] .kill-box .btn{border-width:1.5px;font-weight:600}
[data-theme="household"] .kill-box .house-note.small{text-align:center;font-size:13px;margin:8px 0 0}
[data-theme="household"] h1{font-family:var(--font-head)}
[data-theme="household"] .btn.primary,[data-theme="household"] .btn.soft{font-size:15px}
[data-theme="household"] .rules{padding:0;overflow:hidden}
[data-theme="household"] .rules .part{padding:20px 24px}
[data-theme="household"] .rules .part.foot{background:var(--surface-2);font-size:13px;padding:12px 24px}
[data-theme="household"] .tag{border-radius:999px;background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-soft-ink);font-weight:600}
[data-theme="household"] .tag>.ico{color:var(--accent)}
[data-theme="household"] .tag-from{color:var(--accent-soft-ink)}
[data-theme="household"] .tag-x{border-radius:50%}
[data-theme="household"] .tag-x:hover{background:var(--accent-line)}
[data-theme="household"] .svc{border-radius:16px}
[data-theme="household"] .sched{border-radius:16px;padding:12px 16px}
[data-theme="household"] .stat{border-radius:16px}
[data-theme="household"] .avatar{border-radius:50%}
[data-theme="household"] .avatar.moon{border-radius:12px;width:44px;height:44px}
[data-theme="household"] .avatar.lg{display:inline-flex;width:56px;height:56px;background:var(--accent);color:var(--on-accent);font-family:var(--font-head);font-size:24px}
[data-theme="household"] .avatar.lg.unknown{background:none;color:var(--muted)}
[data-theme="household"] .btn.back{color:var(--accent);font-size:14px}
[data-theme="household"] .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px;margin:0 0 16px}
[data-theme="household"] .tile{display:grid;grid-template-columns:48px minmax(0,1fr);gap:4px 14px;align-items:center;background:var(--surface);
  border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow-card)}
[data-theme="household"] .tile:hover{border-color:var(--tile-hover-line);box-shadow:var(--shadow-raise)}
[data-theme="household"] .tile .avatar{width:48px;height:48px;font-family:var(--font-head);font-size:18px;grid-row:1}
[data-theme="household"] .tile .name{font-family:var(--font-head);font-size:18px}
[data-theme="household"] .tile-figs,[data-theme="household"] .tile-badges{grid-column:1 / -1}
[data-theme="household"] .tile-figs{margin-top:8px}
[data-theme="household"] .tile .go{display:none}
[data-theme="household"] .card.list{padding:0}
[data-theme="household"] .members .list{display:grid;gap:10px;margin:12px 0}
[data-theme="household"] .members .list .item{background:var(--surface-2);border:0;border-radius:16px;padding:12px 16px}
[data-theme="household"] .members .others{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
[data-theme="household"] .members .others .item{background:var(--surface);border:1px solid var(--line)}
[data-theme="household"] .members .others .item.unknown{border-style:dashed;border-color:var(--dashed)}
[data-theme="household"] .members .avatar{width:40px;height:40px;border-radius:12px}
[data-theme="household"] .members .others .avatar{background:var(--chip-bg);color:var(--ink-2)}
[data-theme="household"] .members .others .avatar.unknown{background:none;color:var(--muted)}
[data-theme="household"] .list.schedules{background:none;border:0;box-shadow:none;display:grid;gap:12px;overflow:visible}
[data-theme="household"] .list.schedules .item{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 20px;box-shadow:var(--shadow-card)}
[data-theme="household"] .bigcode{font-size:26px;background:var(--accent-soft);border-radius:14px}
[data-theme="household"] .fld{font-size:14px;font-weight:600}
[data-theme="household"] .modal .card{padding:28px}
[data-theme="household"] .shell.no-house{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "tabs" "content"}
@media (max-width:860px){
  [data-theme="household"] .shell{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "tabs" "house" "content"}
  [data-theme="household"] .house{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));padding-top:16px}
  [data-theme="household"] .house-note:not(.small){display:none}
  [data-theme="household"] .content{padding-top:16px}
}

/* ===== Control room: always dark, dense rows, the day's figures across the top ===== */
[data-theme="control"] .shell{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"top top" "strip house" "tabs tabs" "content content"}
[data-theme="control"] .shell.no-house .strip{grid-column:1 / -1}
[data-theme="control"] .shell>.top{min-height:56px;border-bottom:1px solid var(--line-2);padding:6px var(--band-pad)}
[data-theme="control"] .pill{background:none;border:1px solid var(--ok-line);color:var(--ok-ink)}
[data-theme="control"] .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
[data-theme="control"] .pill.warn{border-color:var(--accent-line);color:var(--warn)}
[data-theme="control"] .pill.warn::before{background:var(--warn)}
[data-theme="control"] .pill.bad{border-color:var(--danger-line);color:var(--danger)}
[data-theme="control"] .pill.bad::before{background:var(--danger)}
[data-theme="control"] .strip{display:flex;flex-wrap:wrap;background:var(--surface-2);border-bottom:1px solid var(--line-2);padding-left:var(--band-pad)}
[data-theme="control"] .fig{flex:1 1 9rem;padding:12px 16px;border-left:1px solid var(--line-2)}
[data-theme="control"] .fig:first-child{border-left:0;padding-left:0}
[data-theme="control"] .fig-label{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
[data-theme="control"] .fig-num{font-family:var(--font-mono);font-size:20px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
[data-theme="control"] .fig:nth-child(2) .fig-num{color:var(--accent)}
[data-theme="control"] .house{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;max-width:36rem;
  background:var(--surface-2);border-bottom:1px solid var(--line-2);padding:10px var(--band-pad) 10px 16px}
[data-theme="control"] .pause-box .house-title,[data-theme="control"] .pause-box .house-note,
[data-theme="control"] .kill-box .house-note.small{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
[data-theme="control"] .pause-box .btn{background:none;font-size:13px;white-space:normal;text-align:left}
[data-theme="control"] .kill-box{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:4px 4px 4px 12px;border:1px solid var(--danger-line);
  border-radius:8px;background:#160F10}
[data-theme="control"] .kill-box .house-title{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--danger);margin:0}
[data-theme="control"] .kill-box .house-title .ico{display:none}
[data-theme="control"] .kill-box .house-note{flex:1 1 12rem;margin:0;font-size:13px;color:var(--body-2)}
[data-theme="control"] .kill-box .btn{background:none;font-size:13px;border-color:var(--danger-line)}
[data-theme="control"] .kill-box .btn:hover{border-color:var(--danger-hover);background:#2A1715}
[data-theme="control"] .tabs{flex-wrap:wrap;border-bottom:1px solid var(--line-2);padding:0 var(--band-pad)}
[data-theme="control"] .tab{min-height:48px;padding:0 14px;color:var(--muted);border-bottom:2px solid transparent;border-radius:0}
[data-theme="control"] .tab:hover{color:var(--ink)}
[data-theme="control"] .tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
[data-theme="control"] .tab .ico{display:none}
[data-theme="control"] .content{padding:20px var(--band-pad) 48px}
[data-theme="control"] .btn{background:none;font-size:13px}
[data-theme="control"] .btn:hover{background:var(--row-hover);border-color:var(--dashed)}
[data-theme="control"] .btn.primary{background:var(--accent);color:var(--on-accent)}
[data-theme="control"] .btn.primary:hover{background:var(--accent-hover)}
