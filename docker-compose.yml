# Start QuietNet on a Raspberry Pi (or any Linux box) with:  docker compose up -d
#
# host networking is required: QuietNet has to see the real home network to know
# which device is which, answer DNS on port 53, and (later) enforce blocks on the LAN.
services:
  quietnet:
    build: .
    container_name: quietnet
    network_mode: host
    restart: unless-stopped
    volumes:
      - quietnet-data:/data
      # Schedules ("Bedtime 21:00 to 07:00") go by the container's clock, which is UTC unless
      # it is told otherwise. This shares the Pi's own time zone with it, clock changes included.
      - /etc/localtime:/etc/localtime:ro
    # Remote access. The dashboard only opens on the Pi itself, so on a Pi with no
    # screen this is how you reach it. Create a pairing code on your relay, then start with:
    #   QUIETNET_CLOUD=https://your-relay.example QUIETNET_PAIR=A1B2-C3D4 docker compose up -d
    # The code is used once; after that the Pi remembers the pairing and both can be left out.
    environment:
      # Time zone for schedules. Left alone it reads the Pi's zone from the file shared above
      # (the leading ":" means "read this file"). To pick one by name instead, start with e.g.
      #   TZ=Europe/London docker compose up -d
      # Never set it to an empty value: the system then treats that as UTC.
      - TZ=${TZ:-:/etc/localtime}
      - QUIETNET_CLOUD=${QUIETNET_CLOUD:-}
      - QUIETNET_PAIR=${QUIETNET_PAIR:-}
    # Give the enforcer time to hand devices back to the router before the container is stopped.
    stop_grace_period: 20s
    # NET_ADMIN + NET_RAW are needed for the network scan and the live-connection
    # enforcer. They only grant access to this machine's own network.
    # The enforcer also needs the Pi itself to pass traffic on, which a container can't
    # switch on by itself. Set it once on the Pi (the device page says if it's missing):
    #   echo net.ipv4.ip_forward=1 | sudo tee /etc/sysctl.d/90-quietnet.conf && sudo sysctl --system
    cap_add:
      - NET_ADMIN
      - NET_RAW

volumes:
  quietnet-data:
